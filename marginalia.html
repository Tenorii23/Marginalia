<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marginalia Study App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EFEEE8;
    --paper-raised: #E5E2D9;
    --paper-deep: #DDD9CD;
    --ink: #1B1D19;
    --ink-soft: #55564E;
    --ink-faint: #86847A;
    --rule: #C9C4B4;
    --rule-strong: #A9A392;
    --oxblood: #7A1F2B;
    --oxblood-dark: #591620;
    --oxblood-wash: #F3E4E3;
    --navy: #2C3B4C;
    --green: #3F6B44;
    --green-wash: #E4EBE1;
    --amber: #8A6416;
    --amber-wash: #F1E9D6;
    
    --font-serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
    --font-sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px;
    --sp-6: 32px; --sp-7: 48px; --sp-8: 64px; --sp-9: 96px;
  }

  html.dark {
    --paper: #121212;
    --paper-raised: #1E1E1E;
    --paper-deep: #2A2A2A;
    --ink: #E0E0E0;
    --ink-soft: #A0A0A0;
    --ink-faint: #707070;
    --rule: #333333;
    --rule-strong: #444444;
    --oxblood: #FF6B6B;
    --oxblood-dark: #FF8787;
    --oxblood-wash: #3A1C1C;
    --navy: #4DABF7;
    --green: #51CF66;
    --green-wash: #1B3A22;
    --amber: #FCC419;
    --amber-wash: #3D3110;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; background: var(--paper); color: var(--ink); font-family: var(--font-sans); }

  h1,h2,h3,h4{ font-family: var(--font-serif); font-weight: 600; margin: 0; color: var(--ink); }
  p{ margin: 0; }
  a{ color: inherit; }
  button, input, select, textarea{ font-family: inherit; font-size: inherit; color: inherit; }
  button{ cursor: pointer; }
  ::selection{ background: var(--oxblood); color: var(--paper); }

  :focus-visible{ outline: 2px solid var(--navy); outline-offset: 2px; }

  .app{ max-width: 920px; margin: 0 auto; padding: 0 var(--sp-5) var(--sp-9); min-height: 100vh; }
  .app-narrow{ max-width: 640px; }

  .topbar{
    display:flex; align-items:baseline; justify-content:space-between;
    padding: var(--sp-6) 0 var(--sp-4);
    border-bottom: 1px solid var(--rule-strong);
    margin-bottom: var(--sp-6);
    flex-wrap: wrap; gap: var(--sp-3);
  }
  .wordmark{ font-family: var(--font-serif); font-size: 22px; font-weight: 700; letter-spacing: 0.2px; }
  .wordmark small{ font-family: var(--font-sans); font-weight: 500; font-size: 12px; color: var(--ink-faint); margin-left: var(--sp-2); }
  .topnav{ display:flex; align-items:center; gap: var(--sp-5); font-size: 13.5px; }
  .topnav a, .topnav button.linklike{
    background:none; border:none; padding:0; color: var(--ink-soft);
    text-decoration: none; border-bottom: 1px solid transparent;
  }
  .topnav a:hover, .topnav button.linklike:hover{ color: var(--ink); border-bottom-color: var(--ink-soft); }
  .topnav .level-badge{
    font-family: var(--font-mono); font-size: 11.5px; color: var(--navy);
    background: var(--paper-raised); padding: 3px 8px; border: 1px solid var(--rule-strong);
  }

  .btn{
    display:inline-flex; align-items:center; gap: var(--sp-2);
    border: 1px solid var(--ink); background: var(--ink); color: var(--paper);
    padding: 10px 18px; font-size: 13.5px; font-weight: 500; letter-spacing: 0.2px;
  }
  .btn:hover{ background: var(--ink-soft); border-color:var(--ink-soft); }
  .btn:active{ transform: translateY(1px); }
  .btn-primary{ background: var(--oxblood); border-color: var(--oxblood); }
  .btn-primary:hover{ background: var(--oxblood-dark); border-color: var(--oxblood-dark); color: white; }
  .btn-outline{ background: transparent; color: var(--ink); border: 1px solid var(--ink); }
  .btn-outline:hover{ background: var(--ink); color: var(--paper); }
  .btn-quiet{ background: transparent; color: var(--ink-soft); border: 1px solid var(--rule-strong); }
  .btn-quiet:hover{ background: var(--paper-raised); color: var(--ink); }
  .btn-sm{ padding: 6px 12px; font-size: 12.5px; }
  .btn[disabled]{ opacity: 0.45; cursor: not-allowed; }

  label.field-label{ display:block; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); margin-bottom: var(--sp-2); text-transform: none; }
  .field-hint{ font-size: 12px; color: var(--ink-faint); margin-top: var(--sp-2); }
  input[type=text], input[type=password], input[type=number], textarea, select{
    width: 100%; background: var(--paper); border: 1px solid var(--rule-strong);
    padding: 10px 12px; color: var(--ink);
  }
  input[type=text]:focus, input[type=password]:focus, input[type=number]:focus, textarea:focus, select:focus{
    border-color: var(--navy);
  }
  textarea{ resize: vertical; min-height: 140px; font-family: var(--font-sans); line-height:1.6; }
  .field{ margin-bottom: var(--sp-5); }
  .choice-row{ display:flex; flex-wrap:wrap; gap: var(--sp-2); }
  .choice-pill{
    border: 1px solid var(--rule-strong); background: var(--paper); padding: 8px 14px; font-size: 13px; color: var(--ink);
  }
  .choice-pill.selected{ background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .checkbox-row{ display:flex; flex-direction:column; gap: var(--sp-2); }
  .checkbox-item{ display:flex; align-items:center; gap: var(--sp-3); font-size: 13.5px; padding: 8px 0; border-bottom: 1px solid var(--rule); }
  .checkbox-item input{ width:16px; height:16px; accent-color: var(--oxblood); }

  .section-heading{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom: var(--sp-3); }
  .section-heading h2{ font-size: 19px; }
  .ledger{ border-top: 1px solid var(--rule-strong); }
  .ledger-row{
    display:flex; align-items:center; justify-content:space-between; gap: var(--sp-4);
    padding: var(--sp-4) 0; border-bottom: 1px solid var(--rule);
  }
  .ledger-row.clickable{ cursor:pointer; }
  .ledger-row.clickable:hover .ledger-title{ color: var(--oxblood); }
  .ledger-title{ font-family: var(--font-serif); font-size: 16.5px; font-weight: 600; }
  .ledger-meta{ font-size: 12.5px; color: var(--ink-faint); margin-top: 3px; }
  .ledger-meta span{ margin-right: var(--sp-4); }
  .ledger-meta .num{ font-family: var(--font-mono); color: var(--ink-soft); }
  .ledger-empty{ padding: var(--sp-6) 0; color: var(--ink-faint); font-size: 13.5px; border-bottom: 1px solid var(--rule); }

  .notes-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(230px,1fr)); gap: var(--sp-4); }
  .sticky{
    background: var(--paper-raised); border: 1px solid var(--rule-strong); border-left: 3px solid var(--amber);
    padding: var(--sp-4); min-height: 130px; display:flex; flex-direction:column; gap: var(--sp-2);
  }
  .sticky h4{ font-size: 14.5px; }
  .sticky p{ font-size: 13px; color: var(--ink-soft); line-height:1.5; }
  .stagger-in{ animation: rise 420ms ease both; }
  @keyframes rise{ from{ opacity:0; transform: translateY(6px);} to{ opacity:1; transform:none; } }

  .tabs{ display:flex; gap: var(--sp-6); border-bottom: 1px solid var(--rule-strong); margin-bottom: var(--sp-5); }
  .tab{
    background:none; border:none; padding: var(--sp-3) 0; font-size: 13.5px; font-weight: 500;
    color: var(--ink-faint); border-bottom: 2px solid transparent; margin-bottom:-1px;
  }
  .tab.active{ color: var(--ink); border-bottom-color: var(--oxblood); }
  .tab:hover{ color: var(--ink); }

  .qcard{ border-top: 1px solid var(--rule); padding: var(--sp-5) 0; }
  .qcard:last-child{ border-bottom: 1px solid var(--rule); }
  .qnum{ font-family: var(--font-mono); font-size: 12px; color: var(--ink-faint); margin-bottom: var(--sp-2); }
  .qtext{ font-size: 15px; margin-bottom: var(--sp-3); }
  .opt{ display:flex; align-items:center; gap: var(--sp-3); padding: 8px 0; font-size: 14px; }
  .opt input{ accent-color: var(--oxblood); width:16px; height:16px; }
  .result-tag{ font-family: var(--font-mono); font-size: 11.5px; padding: 2px 8px; border:1px solid; display:inline-block; }
  .result-tag.correct{ color: var(--green); border-color: var(--green); background: var(--green-wash); }
  .result-tag.incorrect{ color: var(--oxblood); border-color: var(--oxblood); background: var(--oxblood-wash); }
  .result-tag.partial{ color: var(--amber); border-color: var(--amber); background: var(--amber-wash); }
  .feedback-line{ font-size: 13px; color: var(--ink-soft); margin-top: var(--sp-2); padding-left: var(--sp-3); border-left: 2px solid var(--rule-strong); }

  .score-block{
    border: 1px solid var(--ink); padding: var(--sp-6); text-align:center; margin-bottom: var(--sp-6);
  }
  .score-num{ font-family: var(--font-mono); font-size: 44px; font-weight: 500; line-height:1; }
  .score-label{ font-size: 12.5px; color: var(--ink-faint); margin-top: var(--sp-2); letter-spacing: 0.3px; }
  .score-letter{ font-family: var(--font-serif); font-size: 22px; color: var(--oxblood); margin-top: var(--sp-3); }

  .hist-row{ border-bottom: 1px solid var(--rule); padding: var(--sp-4) 0; display:flex; justify-content:space-between; align-items:center; }
  .hist-type{ font-family: var(--font-mono); font-size: 11px; color: var(--navy); border: 1px solid var(--navy); padding: 2px 7px; margin-right: var(--sp-3); }
  .hist-score{ font-family: var(--font-mono); font-size: 15px; }
  #stats-chart { background: var(--paper-raised); padding: 10px; border-radius: 8px; margin-bottom: var(--sp-5); max-width: 100%; height: 250px;}

  .muted{ color: var(--ink-faint); }
  .divider{ border: none; border-top: 1px solid var(--rule); margin: var(--sp-6) 0; }
  .callout{ border: 1px solid var(--rule-strong); background: var(--paper-raised); padding: var(--sp-4); font-size: 13px; color: var(--ink-soft); }
  .callout.warn{ border-color: var(--amber); background: var(--amber-wash); color: #5c4711; }
  .callout.error{ border-color: var(--oxblood); background: var(--oxblood-wash); color: var(--oxblood-dark); }
  .upload-list{ margin-top: var(--sp-3); display:flex; flex-direction:column; gap:6px; }
  .upload-item{ display:flex; justify-content:space-between; align-items:center; font-size: 12.5px; background: var(--paper-raised); border:1px solid var(--rule-strong); padding: 6px 10px; }
  .upload-item button{ background:none; border:none; color: var(--oxblood); font-size:12px; padding:0; }
  .dropzone{ border: 1px dashed var(--rule-strong); padding: var(--sp-5); text-align:center; font-size:13px; color: var(--ink-faint); }
  .dropzone.drag{ border-color: var(--navy); color: var(--navy); }

  .grade-table{ width:100%; border-collapse: collapse; font-size: 13px; }
  .grade-table th{ text-align:left; font-weight:600; color: var(--ink-soft); font-size:11.5px; padding-bottom: var(--sp-2); border-bottom: 1px solid var(--rule-strong); }
  .grade-table td{ padding: 6px 0; border-bottom: 1px solid var(--rule); }
  .grade-table input{ padding: 6px 8px; }

  .loading-overlay{
    position: fixed; inset:0; background: rgba(0,0,0,0.8); z-index: 50;
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap: var(--sp-4);
  }
  .loading-mark{ width: 36px; height: 2px; background: var(--oxblood); animation: sweep 1.1s ease-in-out infinite; }
  @keyframes sweep{ 0%{ transform: scaleX(0.3); opacity:0.5;} 50%{ transform: scaleX(1); opacity:1;} 100%{ transform: scaleX(0.3); opacity:0.5;} }
  .loading-text{ font-family: var(--font-serif); font-size: 15px; color: #FFF; }

  .onboard-wrap{ padding-top: var(--sp-7); }
  .onboard-wrap .wordmark{ font-size: 30px; margin-bottom: var(--sp-2); }
  .onboard-sub{ color: var(--ink-soft); font-size: 14px; margin-bottom: var(--sp-6); max-width: 460px; }
  .footer-note{ margin-top: var(--sp-9); padding-top: var(--sp-4); border-top: 1px solid var(--rule); font-size: 11.5px; color: var(--ink-faint); }

  @media (max-width: 560px){
    .app{ padding: 0 var(--sp-4) var(--sp-8); }
    .topbar{ padding: var(--sp-5) 0 var(--sp-3); }
    .notes-grid{ grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
(function(){

const S = {
  profile: null,
  apiKey: '',
  model: 'gemini-3.6-flash',
  studySets: [],
  route: 'loading',
  authMode: 'signup',
  currentSetId: null,
  currentTab: 'notes',
  newSet: null,
  quizSession: null,
  testSession: null,
  loading: false,
  loadingMsg: '',
  error: null,
  darkMode: localStorage.getItem('darkMode') === 'true',
  modelFallbackModal: null,
};

function applyDarkMode() {
  if (S.darkMode) document.documentElement.classList.add('dark');
  else document.documentElement.classList.remove('dark');
}
applyDarkMode();

const SAFE_FALLBACK_MODEL = 'gemini-3.6-flash';
const FALLBACK_MODELS = [
  { id: 'gemini-3.6-flash', label: 'Gemini 3.6 Flash' },
  { id: 'gemini-3.5-flash', label: 'Gemini 3.5 Flash' },
  { id: 'gemini-3.5-flash-lite', label: 'Gemini 3.5 Flash-Lite' },
];

const PRESET_SCALES = {
  standard: [ {label:'A', min:90}, {label:'B', min:80}, {label:'C', min:70}, {label:'D', min:60}, {label:'F', min:0} ],
  plusminus: [
    {label:'A',min:93},{label:'A-',min:90},{label:'B+',min:87},{label:'B',min:83},{label:'B-',min:80},
    {label:'C+',min:77},{label:'C',min:73},{label:'C-',min:70},{label:'D+',min:67},{label:'D',min:63},
    {label:'D-',min:60},{label:'F',min:0}
  ],
  passfail: [ {label:'Pass', min:60}, {label:'Fail', min:0} ],
};

function defaultGradeScale(){ return { mode:'preset', preset:'standard', custom: PRESET_SCALES.standard.slice() }; }

function activeScaleTable(){
  const gs = S.profile?.gradeScale || defaultGradeScale();
  if(gs.mode === 'custom') return gs.custom.slice().sort((a,b)=>b.min-a.min);
  return (PRESET_SCALES[gs.preset] || PRESET_SCALES.standard).slice();
}
function letterFor(pct){
  const table = activeScaleTable();
  for(const row of table){ if(pct >= row.min) return row.label; }
  return table[table.length-1]?.label || '';
}

async function storeGet(key){
  try{ const r = localStorage.getItem(key); return r ? JSON.parse(r) : null; }
  catch(e){ return null; }
}
async function storeSet(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }
  catch(e){ console.error('storage set failed', key, e); }
}
async function storeDelete(key){
  try{ localStorage.removeItem(key); }catch(e){}
}

async function hashPassword(password) {
  const msgBuffer = new TextEncoder().encode(password);
  const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

function exportStudyDataToJSON() {
    const appData = {
        profile: S.profile,
        studySets: S.studySets
    };
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 4));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", "marginalia_backup.json");
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
}

async function loadAll(){
  const profile = await storeGet('profile');
  const apiKey = await storeGet('apiKey');
  const model = await storeGet('model');
  let sets = [];
  if(profile && profile.name){
    const index = await storeGet('studysets:index:' + profile.name) || [];
    for(const id of index){
      const s = await storeGet('studyset:' + profile.name + ':' + id);
      if(s) sets.push(s);
    }
  }
  sets.sort((a,b)=> (b.updatedAt||0) - (a.updatedAt||0));
  S.profile = profile;
  S.apiKey = apiKey || '';
  S.model = model || 'gemini-3.6-flash';
  S.studySets = sets;
  S.route = profile ? 'dashboard' : 'onboarding';
  render();
}

async function saveProfile(){ await storeSet('profile', S.profile); }
async function saveApiKey(){ await storeSet('apiKey', S.apiKey); }
async function saveModel(){ await storeSet('model', S.model); }

async function saveStudySet(set){
  if(!S.profile) return;
  set.updatedAt = Date.now();
  await storeSet('studyset:' + S.profile.name + ':' + set.id, set);
  const idx = S.studySets.findIndex(s=>s.id===set.id);
  if(idx>=0) S.studySets[idx] = set; else S.studySets.unshift(set);
  const index = S.studySets.map(s=>s.id);
  await storeSet('studysets:index:' + S.profile.name, index);
}

async function deleteStudySet(id){
  if(!S.profile) return;
  await storeDelete('studyset:' + S.profile.name + ':' + id);
  S.studySets = S.studySets.filter(s=>s.id!==id);
  await storeSet('studysets:index:' + S.profile.name, S.studySets.map(s=>s.id));
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function requestModelFallback(failedModel, errorMsg) {
  return new Promise((resolve) => {
    let fallbackModel = FALLBACK_MODELS.map(m => m.id).find(m => m !== failedModel) || SAFE_FALLBACK_MODEL;
    
    S.modelFallbackModal = {
      failedModel,
      fallbackModel,
      errorMsg,
      resolve
    };
    S.loading = false;
    render();
  });
}

async function callGemini(parts, { jsonSchema=true, _retried=false } = {}){
  if(!S.apiKey){ throw new Error('No API key set. Add your Google AI Studio API key in Settings.'); }
  const model = S.model || SAFE_FALLBACK_MODEL;
  const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + model + ':generateContent?key=' + encodeURIComponent(S.apiKey);
  const body = {
    contents: [{ role: 'user', parts }],
    generationConfig: jsonSchema ? { responseMimeType: 'application/json', temperature: 0.4 } : { temperature: 0.4 }
  };
  let res;
  try{
    res = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  }catch(networkErr){
    throw new Error('Could not reach the Gemini API. Ensure you are connected to the internet and API Key is valid.');
  }
  if(!res.ok){
    let msg = '';
    try{ const j = await res.json(); msg = j.error?.message || JSON.stringify(j); }catch(e){ msg = await res.text(); }
    const retired = res.status===404 && /no longer available|not found for API version|is not found/i.test(msg);
    if(retired && !_retried && model !== SAFE_FALLBACK_MODEL){
      S.model = SAFE_FALLBACK_MODEL;
      await saveModel();
      S.autoSwitchedModel = { from: model, to: SAFE_FALLBACK_MODEL };
      return callGemini(parts, { jsonSchema, _retried: true });
    }

    const highDemand = res.status === 429 || /resource_exhausted|quota|overloaded|high demand|too many requests/i.test(msg);
    if(highDemand && !_retried){
      const shouldSwitch = await requestModelFallback(model, msg);
      if(shouldSwitch){
        return callGemini(parts, { jsonSchema, _retried: true });
      }
    }

    throw new Error('Gemini API error (' + res.status + '): ' + msg.slice(0,300));
  }
  const data = await res.json();
  if(data.promptFeedback?.blockReason){ throw new Error('Request was blocked: ' + data.promptFeedback.blockReason); }
  const cand = data.candidates && data.candidates[0];
  const text = cand?.content?.parts?.map(p=>p.text||'').join('') || '';
  if(!text) throw new Error('Empty response from the model. Try again.');
  if(!jsonSchema) return text;
  try{ return JSON.parse(text); }
  catch(e){
    const cleaned = text.replace(/```json/gi,'').replace(/```/g,'').trim();
    return JSON.parse(cleaned);
  }
}

function fileToInlinePart(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const base64 = reader.result.split(',')[1];
      resolve({ inlineData: { mimeType: file.type || 'application/octet-stream', data: base64 } });
    };
    reader.onerror = ()=> reject(new Error('Could not read file: ' + file.name));
    reader.readAsDataURL(file);
  });
}

const TYPE_LABELS = {
  multiple_choice: 'Multiple choice',
  true_false: 'True or false',
  short_answer: 'Short answer',
  fill_blank: 'Fill in the blank',
};

async function generateStudyMaterials({ title, notesText, files, level, count, types }){
  const typeList = types.map(t=>TYPE_LABELS[t]).join(', ');
  const targetLang = S.profile?.language === 'albanian' ? 'Albanian (Gjuha Shqipe)' : 'English';
  const prompt = [
    'You are building study materials for a ' + (level==='college'?'college':'high school') + ' student.',
    'Topic / set title: ' + title,
    '',
    'Source material follows below as pasted notes and/or attached files (images or PDFs of notes).',
    'Read everything carefully before writing anything.',
    '',
    'IMPORTANT: All generated text content (including notesSummary, stickyNotes titles and bodies, quiz questions, options, and answers) MUST be entirely in ' + targetLang + '.',
    '',
    'Produce a JSON object with exactly these fields:',
    '{',
    '  "notesSummary": string,  // a clear, consolidated plain-text write-up of the source material, thorough enough to write a test from later, no formatting markup, 300-900 words',
    '  "stickyNotes": [ { "title": string, "body": string } ],  // 6 to 12 short revision notes, each title is a concept name, body is 1-3 sentences a student could copy onto an index card',
    '  "quiz": [ { "type": one of ["multiple_choice","true_false","short_answer","fill_blank"], "question": string, "options": [string] (only for multiple_choice, 4 options), "answer": string } ]',
    '}',
    '',
    'Generate exactly ' + count + ' quiz questions, using only these question types: ' + typeList + '.',
    'Distribute question types roughly evenly across the allowed types. Base every question strictly on the source material, nothing invented.',
    'For fill_blank questions, use "_____" in the question text to mark the blank, and give the exact missing word or phrase as the answer.',
    'Calibrate difficulty for a ' + (level==='college'?'college':'high school') + ' student.',
    'Respond with JSON only.',
  ].join('\n');

  const parts = [{ text: prompt }];
  if(files && files.length){
    for(const f of files) parts.push(f);
  }
  if(notesText && notesText.trim()){
    parts.push({ text: 'Pasted notes:\n' + notesText });
  }
  return callGemini(parts);
}

async function gradeShortAnswers(items){
  const targetLang = S.profile?.language === 'albanian' ? 'Albanian (Gjuha Shqipe)' : 'English';
  const prompt = [
    'You are an expert, fair teacher grading student quiz answers in ' + targetLang + '.',
    'Grade each student answer below against the expected answer with full flexibility and free will. Account for language differences, true/false translations (e.g., matching English "True" or "False" to Albanian "E vërtetë" or "E rreme"/"E gabuar"), synonyms, spelling, case, and word order; the student does not need to match the expected answer word for word, only demonstrate correct substance and conceptual understanding.',
    'Return a JSON array, same length and order as the input, where each element is:',
    '{ "correct": boolean, "feedback": string }',
    'Keep feedback to one short, constructive sentence in ' + targetLang + '.',
    '',
    'Items:',
    JSON.stringify(items.map((it,i)=>({ index:i, question: it.question, expectedAnswer: it.expected, studentAnswer: it.userAnswer || '(no answer given)' }))),
  ].join('\n');
  return callGemini([{ text: prompt }]);
}

async function generateTest({ title, notesSummary, level, count }){
  const targetLang = S.profile?.language === 'albanian' ? 'Albanian (Gjuha Shqipe)' : 'English';
  const prompt = [
    'Write a formal test for a ' + (level==='college'?'college':'high school') + ' student, based only on the following study material summary for "' + title + '":',
    '',
    notesSummary,
    '',
    'IMPORTANT: Write all test questions, rubrics, and related text entirely in ' + targetLang + '.',
    'Produce a JSON object: { "questions": [ { "type": "short_answer" or "essay", "question": string, "rubric": string, "points": number } ] }.',
    'Write ' + count + ' questions total. Mostly short_answer (a sentence or two expected), include 1-2 essay questions if the material supports it (a paragraph expected).',
    'The "rubric" field should briefly describe what a full-credit answer must include, for grading purposes later; do not show this to the student.',
    'Points should sum to 100 across all questions, weighted by difficulty and depth expected.',
    'Respond with JSON only.',
  ].join('\n');
  return callGemini([{ text: prompt }]);
}

async function gradeTest(items){
  const targetLang = S.profile?.language === 'albanian' ? 'Albanian (Gjuha Shqipe)' : 'English';
  const prompt = [
    'You are grading a student test in ' + targetLang + '. For each question, compare the student answer to the rubric and award partial credit fairly. The student does not need exact wording, only to demonstrate the required understanding.',
    'Return a JSON array, same length and order as input:',
    '{ "pointsEarned": number, "feedback": string }',
    'pointsEarned must be between 0 and the question\'s points value (may be fractional). Feedback is one or two short sentences explaining the score, written directly to the student in ' + targetLang + '.',
    '',
    'Items:',
    JSON.stringify(items.map((it,i)=>({ index:i, question: it.question, rubric: it.rubric, pointsPossible: it.points, studentAnswer: it.userAnswer || '(no answer given)' }))),
  ].join('\n');
  return callGemini([{ text: prompt }]);
}

const root = document.getElementById('root');

function render(){
  if(S.route === 'loading'){ root.innerHTML = ''; return; }
  let html = '';
  if(S.route === 'onboarding') html = renderOnboarding();
  else {
    html = '<div class="app">' + renderTopbar() + renderAutoSwitchBanner() + renderRoute() + renderFooter() + '</div>';
  }
  if(S.loading){ html += renderLoadingOverlay(); }
  if(S.modelFallbackModal){ html += renderModelFallbackModal(); }
  root.innerHTML = html;
  bindEvents();
}

function renderAutoSwitchBanner(){

function renderQuizQuestionInput(q, i, userAns){
  userAns = userAns || '';
  if(q.type === 'multiple_choice'){
    return (
      '<div class="qcard">' +
        '<div class="qnum">QUESTION ' + (i+1) + ' &bull; MULTIPLE CHOICE</div>' +
        '<div class="qtext">' + esc(q.question) + '</div>' +
        '<div class="checkbox-row">' +
          (q.options||[]).map(opt => (
            '<label class="opt"><input type="radio" name="q_' + i + '" value="' + esc(opt) + '" ' + (userAns===opt?'checked':'') + ' /> ' + esc(opt) + '</label>'
          )).join('') +
        '</div>' +
      '</div>'
    );
  }
  if(q.type === 'true_false'){
    return (
      '<div class="qcard">' +
        '<div class="qnum">QUESTION ' + (i+1) + ' &bull; TRUE OR FALSE</div>' +
        '<div class="qtext">' + esc(q.question) + '</div>' +
        '<div class="checkbox-row">' +
          '<label class="opt"><input type="radio" name="q_' + i + '" value="True" ' + (userAns==='True'?'checked':'') + ' /> True</label>' +
          '<label class="opt"><input type="radio" name="q_' + i + '" value="False" ' + (userAns==='False'?'checked':'') + ' /> False</label>' +
        '</div>' +
      '</div>'
    );
  }
  return (
    '<div class="qcard">' +
      '<div class="qnum">QUESTION ' + (i+1) + ' &bull; ' + (q.type==='fill_blank'?'FILL IN THE BLANK':'SHORT ANSWER') + '</div>' +
      '<div class="qtext">' + esc(q.question) + '</div>' +
      '<input type="text" class="quiz-text-in" data-qidx="' + i + '" value="' + esc(userAns) + '" placeholder="Your answer..." />' +
    '</div>'
  );
}

function renderQuizQuestionsReview(sess){
  return sess.questions.map((q, i) => {
    const res = sess.gradedResults[i] || { correct: false, feedback: '' };
    const tagClass = res.correct ? 'correct' : 'incorrect';
    const tagText = res.correct ? 'CORRECT' : 'INCORRECT';
    return (
      '<div class="qcard">' +
        '<div class="qnum">QUESTION ' + (i+1) + ' &bull; <span class="result-tag ' + tagClass + '">' + tagText + '</span></div>' +
        '<div class="qtext">' + esc(q.question) + '</div>' +
        '<div style="font-size:13.5px; margin-bottom:4px;">Your answer: <strong>' + esc(sess.answers[i]||'(no answer)') + '</strong></div>' +
        (!res.correct ? '<div style="font-size:13.5px; margin-bottom:4px; color:var(--oxblood);">Expected answer: <strong>' + esc(q.answer) + '</strong></div>' : '') +
        (res.feedback ? '<div class="feedback-line">' + esc(res.feedback) + '</div>' : '') +
      '</div>'
    );
  }).join('');
}

        '<div style="display:flex; gap:var(--sp-3); align-items:center;">' +

return (

        '<div class="qcard">' +
          '<div class="qnum">QUESTION ' + (i+1) + ' &bull; ' + q.points + ' PTS &bull; ' + q.type.toUpperCase().replace('_',' ') + '</div>' +
          '<div class="qtext">' + esc(q.question) + '</div>' +
          '<textarea class="test-text-in" data-tidx="' + i + '" placeholder="Write your response...">' + esc(sess.answers[i]||'') + '</textarea>' +
        '</div>'
      )).join('') +
      '<div style="margin-top:var(--sp-6);">' +
        '<button class="btn btn-primary" id="submit-test">Submit test for grading</button>' +
      '</div>' +
    '</div>'
  );
}
function renderTestQuestionsReview(sess){
  return sess.questions.map((q, i) => {
    const res = sess.gradedResults[i] || { pointsEarned: 0, feedback: '' };
    const earned = res.pointsEarned;
    const max = q.points;
    const partial = earned > 0 && earned < max;
    const tagClass = earned >= max ? 'correct' : partial ? 'partial' : 'incorrect';
    const tagText = earned.toFixed(1) + ' / ' + max + ' PTS';
    return (
      '<div class="qcard">' +
        '<div class="qnum">QUESTION ' + (i+1) + ' &bull; <span class="result-tag ' + tagClass + '">' + tagText + '</span></div>' +
        '<div class="qtext">' + esc(q.question) + '</div>' +
        '<div style="font-size:13.5px; margin-bottom:6px; white-space:pre-wrap;">Your answer: <strong>' + esc(sess.answers[i]||'(no answer)') + '</strong></div>' +
        (res.feedback ? '<div class="feedback-line">' + esc(res.feedback) + '</div>' : '') +
      '</div>'
    );
  }).join('');
}

function renderTabHistory(set){

let chartInstance = null;
function initHistoryChart(history){
  const canvas = document.getElementById('stats-chart');
  if(!canvas) return;
  if(chartInstance){ chartInstance.destroy(); chartInstance = null; }
  if(!history || !history.length){ canvas.style.display = 'none'; return; }
  canvas.style.display = 'block';
  
  const labels = history.map((h, i) => '#' + (i+1) + ' (' + h.type.slice(0,1).toUpperCase() + ')');
  const data = history.map(h => h.pct);
  
  chartInstance = new Chart(canvas, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Score %',
        data,
        borderColor: '#7A1F2B',
        backgroundColor: 'rgba(122,31,43,0.1)',
        fill: true,
        tension: 0.2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        y: { min: 0, max: 100, ticks: { stepSize: 20 } }
      }
    }
  });
}

function bindEvents(){
  const dismissBtn = document.getElementById('dismiss-autoswitch');
  if(dismissBtn){ dismissBtn.onclick = ()=>{ S.autoSwitchedModel = null; render(); }; }

  const fallbackCancel = document.getElementById('fallback-cancel');
  if(fallbackCancel){
    fallbackCancel.onclick = () => {
      const resolveFn = S.modelFallbackModal.resolve;
      S.modelFallbackModal = null;
      render();
      resolveFn(false);
    };
  }

  const fallbackConfirm = document.getElementById('fallback-confirm');
  if(fallbackConfirm){
    fallbackConfirm.onclick = () => {
      const m = S.modelFallbackModal;
      const resolveFn = m.resolve;
      S.model = m.fallbackModel;
      saveModel();
      S.modelFallbackModal = null;
      S.loading = true;
      S.loadingMsg = 'Retrying with fallback model...';
      render();
      resolveFn(true);
    };
  }

  const darkBtn = document.getElementById('btn-dark-mode');
  if(darkBtn){
    darkBtn.onclick = ()=>{
      S.darkMode = !S.darkMode;
      localStorage.setItem('darkMode', S.darkMode);
      applyDarkMode();
      render();
    };
  }

  const logoutBtn = document.getElementById('btn-logout');
  if(logoutBtn){
    logoutBtn.onclick = async () => {
      await storeDelete('profile');
      S.profile = null;
      S.route = 'onboarding';
      render();
    };
  }

  const exportJsonBtn = document.getElementById('btn-export-json');
  if(exportJsonBtn){
    exportJsonBtn.onclick = () => {
      exportStudyDataToJSON();
    };
  }

  document.querySelectorAll('[data-nav]').forEach(el => {
    el.onclick = (e) => {
      const target = e.currentTarget.getAttribute('data-nav');
      if(target === 'dashboard'){ S.route = 'dashboard'; S.currentSetId = null; }
      else if(target === 'settings'){ S.route = 'settings'; }
      else if(target === 'newset'){ S.route = 'newset'; S.newSet = null; }
      render();
    };
  });

  const authToggleMode = document.getElementById('auth-toggle-mode');
  if(authToggleMode){
    authToggleMode.onclick = () => {
      S.authMode = S.authMode === 'login' ? 'signup' : 'login';
      S._authError = null;
      render();
    };
  }

  document.querySelectorAll('[data-ob-level]').forEach(el => {
    el.onclick = (e) => {
      if(!S._onboardDraft) S._onboardDraft = { name: '', password: '', level: 'college' };
      S._onboardDraft.level = e.currentTarget.getAttribute('data-ob-level');
      render();
    };
  });

  const authSubmit = document.getElementById('auth-submit');
  if(authSubmit){
    authSubmit.onclick = () => {
      const nameInput = document.getElementById('auth-name').value.trim();
      const passInput = document.getElementById('auth-password').value;
      const apiKeyInput = document.getElementById('auth-apikey').value.trim();
      
      if (!nameInput || !passInput) {
        S._authError = 'Please fill in both name and password.';
        render();
        return;
      }

      hashPassword(passInput).then(async (hashedPass) => {
        const savedAccount = await storeGet('user_account:' + nameInput);

        if (S.authMode === 'signup') {
          if (savedAccount) {
            S._authError = 'Username already exists. Please log in instead.';
            render();
            return;
          }
          const newProfile = {
            name: nameInput,
            passwordHash: hashedPass,
            level: S._onboardDraft?.level || 'college',
            gradeScale: defaultGradeScale(),
            language: 'english'
          };
          await storeSet('user_account:' + nameInput, newProfile);
          await storeSet('profile', newProfile);
          await storeSet('studysets:index:' + nameInput, []);
          S.profile = newProfile;
          S.studySets = [];
          if(apiKeyInput){
            S.apiKey = apiKeyInput;
            await saveApiKey();
          }
          S.route = 'dashboard';
          render();
        } else {
          if (!savedAccount || savedAccount.passwordHash !== hashedPass) {
            S._authError = 'Incorrect username or password.';
            render();
            return;
          }
          await storeSet('profile', savedAccount);
          S.profile = savedAccount;
          if(apiKeyInput){
            S.apiKey = apiKeyInput;
            await saveApiKey();
          } else {
            const existingKey = await storeGet('apiKey');
            if(existingKey) S.apiKey = existingKey;
          }
          S.route = 'dashboard';
          render();
        }
      });
    };
  }

  const settingsApiKey = document.getElementById('set-apikey');
  if(settingsApiKey){
    settingsApiKey.oninput = (e) => {
      S.apiKey = e.target.value.trim();
      saveApiKey();
    };
  }

  const settingsSave = document.getElementById('settings-save');
  if(settingsSave){
    settingsSave.onclick = () => {
      const name = document.getElementById('set-name').value.trim();
      const model = document.getElementById('set-model').value;
      const language = document.getElementById('set-language').value;
      if(!name){ alert('Name cannot be blank.'); return; }
      S.profile.name = name;
      S.model = model;
      S.profile.language = language;
      saveProfile();
      saveApiKey();
      saveModel();
      alert('Settings saved successfully.');
      S.route = 'dashboard';
      render();
    };
  }

  document.querySelectorAll('[data-set-level]').forEach(el => {
    el.onclick = (e) => {
      S.profile.level = e.currentTarget.getAttribute('data-set-level');
      render();
    };
  });

  document.querySelectorAll('[data-scale-preset]').forEach(el => {
    el.onclick = (e) => {
      const p = e.currentTarget.getAttribute('data-scale-preset');
      if(!S.profile.gradeScale) S.profile.gradeScale = defaultGradeScale();
      if(p === 'custom'){
        S.profile.gradeScale.mode = 'custom';
        S.profile.gradeScale.preset = 'standard';
        if(!S.profile.gradeScale.custom) S.profile.gradeScale.custom = PRESET_SCALES.standard.slice();
      } else {
        S.profile.gradeScale.mode = 'preset';
        S.profile.gradeScale.preset = p;
      }
      render();
    };
  });

  const addScaleRow = document.getElementById('scale-add-row');
  if(addScaleRow){
    addScaleRow.onclick = () => {
      if(!S.profile.gradeScale.custom) S.profile.gradeScale.custom = [];
      S.profile.gradeScale.custom.push({ label: 'X', min: 50 });
      render();
    };
  }
  document.querySelectorAll('.scale-label-in').forEach(el => {
    el.onchange = (e) => {
      const idx = parseInt(e.target.getAttribute('data-idx'));
      S.profile.gradeScale.custom[idx].label = e.target.value;
    };
  });
  document.querySelectorAll('.scale-min-in').forEach(el => {
    el.onchange = (e) => {
      const idx = parseInt(e.target.getAttribute('data-idx'));
      S.profile.gradeScale.custom[idx].min = parseFloat(e.target.value) || 0;
    };
  });
  document.querySelectorAll('.scale-del').forEach(el => {
    el.onclick = (e) => {
      const idx = parseInt(e.currentTarget.getAttribute('data-idx'));
      S.profile.gradeScale.custom.splice(idx, 1);
      render();
    };
  });

  document.querySelectorAll('[data-open-set]').forEach(el => {
    el.onclick = (e) => {
      S.currentSetId = e.currentTarget.getAttribute('data-open-set');
      S.currentTab = 'notes';
      S.quizSession = null;
      S.testSession = null;
      S.route = 'set';
      render();
    };
  });

  document.querySelectorAll('[data-delete-set]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const id = e.currentTarget.getAttribute('data-delete-set');
      if(confirm('Are you sure you want to delete this study set?')){
        deleteStudySet(id);
        render();
      }
    };
  });

  const dropzone = document.getElementById('ns-dropzone');
  const fileinput = document.getElementById('ns-fileinput');
  if(dropzone && fileinput){
    dropzone.onclick = () => fileinput.click();
    dropzone.ondragover = (e) => { e.preventDefault(); dropzone.classList.add('drag'); };
    dropzone.ondragleave = () => dropzone.classList.remove('drag');
    dropzone.ondrop = async (e) => {
      e.preventDefault(); dropzone.classList.remove('drag');
      const files = Array.from(e.dataTransfer.files);
      for(const f of files){
        const part = await fileToInlinePart(f);
        S.newSet.files.push({ name: f.name, inlineData: part.inlineData });
      }
      render();
    };
    fileinput.onchange = async (e) => {
      const files = Array.from(e.target.files);
      for(const f of files){
        const part = await fileToInlinePart(f);
        S.newSet.files.push({ name: f.name, inlineData: part.inlineData });
      }
      render();
    };
  }

  document.querySelectorAll('[data-remove-file]').forEach(el => {
    el.onclick = (e) => {
      const idx = parseInt(e.currentTarget.getAttribute('data-remove-file'));
      S.newSet.files.splice(idx, 1);
      render();
    };
  });

  const nsGenerate = document.getElementById('ns-generate');
  if(nsGenerate){
    nsGenerate.onclick = async () => {
      const title = document.getElementById('ns-title').value.trim();
      const notesText = document.getElementById('ns-notes').value.trim();
      const level = document.getElementById('ns-level').value;
      const count = parseInt(document.getElementById('ns-count').value);
      const types = Array.from(document.querySelectorAll('input[name="ns-type"]:checked')).map(el=>el.value);
      
      if(!title){ alert('Please enter a set title.'); return; }
      if(!notesText && (!S.newSet.files || S.newSet.files.length === 0)){ alert('Please provide pasted notes or attach files.'); return; }
      if(types.length === 0){ alert('Please select at least one question type.'); return; }

      S.loading = true;
      S.loadingMsg = 'Reading materials & generating study set...';
      render();

      try{
        const result = await generateStudyMaterials({
          title,
          notesText,
          files: S.newSet.files ? S.newSet.files.map(f=>({ inlineData: f.inlineData })) : [],
          level,
          count,
          types
        });

        const newSet = {
          id: uid(),
          title,
          createdAt: Date.now(),
          updatedAt: Date.now(),
          notesSummary: result.notesSummary,
          stickyNotes: result.stickyNotes,
          quiz: result.quiz,
          history: []
        };

        await saveStudySet(newSet);
        S.currentSetId = newSet.id;
        S.currentTab = 'notes';
        S.route = 'set';
      }catch(e){
        alert('Generation failed: ' + e.message);
      }finally{
        S.loading = false;
        render();
      }
    };
  }

  document.querySelectorAll('[data-set-tab]').forEach(el => {
    el.onclick = (e) => {
      S.currentTab = e.currentTarget.getAttribute('data-set-tab');
      render();
      if(S.currentTab === 'history'){
        const set = S.studySets.find(s=>s.id===S.currentSetId);
        if(set) initHistoryChart(set.history);
      }
    };
  });

  const startQuizBtn = document.getElementById('start-quiz');
  if(startQuizBtn){
    startQuizBtn.onclick = () => {
      const set = S.studySets.find(s=>s.id===S.currentSetId);
      S.quizSession = {
        questions: set.quiz,
        answers: {},
        submitted: false,
        score: 0,
        total: set.quiz.length,
        gradedResults: []
      };
      render();
    };
  }

  const restartQuizBtn = document.getElementById('restart-quiz');
  if(restartQuizBtn){
    restartQuizBtn.onclick = () => {
      const set = S.studySets.find(s=>s.id===S.currentSetId);
      S.quizSession = {
        questions: set.quiz,
        answers: {},
        submitted: false,
        score: 0,
        total: set.quiz.length,
        gradedResults: []
      };
      render();
    };

      const name = e.target.name;

      if(S.quizSession) S.quizSession.answers[qidx] = e.target.value;
    };
  });

  document.querySelectorAll('.quiz-text-in').forEach(el => {
    el.oninput = (e) => {
      const qidx = parseInt(e.target.getAttribute('data-qidx'));
      if(S.quizSession) S.quizSession.answers[qidx] = e.target.value;
    };
  });

  const submitQuizBtn = document.getElementById('submit-quiz');
  if(submitQuizBtn){
    submitQuizBtn.onclick = async () => {
      const sess = S.quizSession;
      const set = S.studySets.find(s=>s.id===S.currentSetId);
      
      const shortItems = [];
      const shortIndices = [];
      sess.questions.questionsubmitted = false;
      sess.questions.forEach((q, i) => {
        if(q.type === 'short_answer' || q.type === 'fill_blank' || q.type === 'true_false'){
          shortItems.push({ question: q.question, expected: q.answer, userAnswer: sess.answers[i] });
          shortIndices.push(i);
        }
      });

      S.loading = true;
      S.loadingMsg = 'Grading quiz answers...';
      render();

      try{
        let gradedShort = [];
        if(shortItems.length > 0){
          gradedShort = await gradeShortAnswers(shortItems);
        }

        let score = 0;
        const gradedResults = [];
        let shortCursor = 0;

        sess.questions.forEach((q, i) => {
          const userAns = (sess.answers[i] || '').trim();
          if(q.type === 'short_answer' || q.type === 'fill_blank' || q.type === 'true_false'){
            const g = gradedShort[shortCursor++] || { correct: false, feedback: '' };
            gradedResults[i] = g;
            if(g.correct) score++;
          } else {
            const correct = userAns.toLowerCase() === q.answer.toLowerCase();
            gradedResults[i] = { correct, feedback: correct ? 'Correct.' : 'Expected: ' + q.answer };
            if(correct) score++;
          }
        });

        sess.score = score;
        sess.submitted = true;
        sess.gradedResults = gradedResults;

        const pct = Math.round((score / sess.total) * 100);
        const letter = letterFor(pct);
        if(!set.history) set.history = [];
        set.history.push({
          type: 'quiz',
          timestamp: Date.now(),
          scoreText: score + '/' + sess.total,
          pct,
          letter
        });
        await saveStudySet(set);
      }catch(e){
        alert('Grading failed: ' + e.message);
      }finally{
        S.loading = false;
        render();
      }
    };
  }

  const generateTestBtn = document.getElementById('generate-test');
  if(generateTestBtn){
    generateTestBtn.onclick = async () => {
      const set = S.studySets.find(s=>s.id===S.currentSetId);
      const count = parseInt(document.getElementById('test-count').value);
      S.loading = true;
      S.loadingMsg = 'Generating formal test...';
      render();

      try{
        const res = await generateTest({ title: set.title, notesSummary: set.notesSummary, level: S.profile.level, count });
        const totalPoints = res.questions.reduce((acc,q)=>acc+q.points, 0);
        S.testSession = {
          questions: res.questions,
          totalPoints,
          answers: {},
          submitted: false,
          pointsEarned: 0,
          gradedResults: []
        };
      }catch(e){
        alert('Test generation failed: ' + e.message);
      }finally{
        S.loading = false;
        render();
      }
    };
  }

  const discardTestBtn = document.getElementById('discard-test');
  if(discardTestBtn){
    discardTestBtn.onclick = () => {
      S.testSession = null;
      render();
    };
  }

  document.querySelectorAll('.test-text-in').forEach(el => {
    el.oninput = (e) => {
      const tidx = parseInt(e.target.getAttribute('data-tidx'));
      if(S.testSession) S.testSession.answers[tidx] = e.target.value;
    };
  });

  const submitTestBtn = document.getElementById('submit-test');
  if(submitTestBtn){
    submitTestBtn.onclick = async () => {
      const sess = S.testSession;
      const set = S.studySets.find(s=>s.id===S.currentSetId);

      const items = sess.questions.map((q, i) => ({
        question: q.question,
        rubric: q.rubric,
        points: q.points,
        userAnswer: sess.answers[i]
      }));

      S.loading = true;
      S.loadingMsg = 'Grading test responses...';
      render();

      try{
        const graded = await gradeTest(items);
        let pointsEarned = 0;
        const gradedResults = sess.questions.map((q, i) => {
          const g = graded[i] || { pointsEarned: 0, feedback: '' };
          const earned = Math.max(0, Math.min(q.points, typeof g.pointsEarned === 'number' ? g.pointsEarned : 0));
          pointsEarned += earned;
          return { pointsEarned: earned, feedback: g.feedback };
        });

        sess.pointsEarned = pointsEarned;
        sess.submitted = true;
        sess.gradedResults = gradedResults;

        const pct = Math.round((pointsEarned / sess.totalPoints) * 100);
        const letter = letterFor(pct);
        if(!set.history) set.history = [];
        set.history.push({
          type: 'test',
          timestamp: Date.now(),
          scoreText: pointsEarned.toFixed(1) + '/' + sess.totalPoints,
          pct,
          letter
        });
        await saveStudySet(set);
      }catch(e){
        alert('Test grading failed: ' + e.message);
      }finally{
        S.loading = false;
        render();
      }
    };
  }
}

loadAll();

})();
</script>
