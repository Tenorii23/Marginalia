<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password - Marginalia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EFEEE8;
    --paper-raised: #E5E2D9;
    --ink: #1B1D19;
    --ink-soft: #55564E;
    --ink-faint: #86847A;
    --rule: #C9C4B4;
    --rule-strong: #A9A392;
    --oxblood: #7A1F2B;
    --oxblood-dark: #591620;
    --oxblood-wash: #F3E4E3;
    --green: #3F6B44;
    --green-wash: #E4EBE1;
    --font-serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
    --font-sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #121212; --paper-raised: #1E1E1E; --ink: #E0E0E0; --ink-soft: #A0A0A0;
      --ink-faint: #707070; --rule: #333333; --rule-strong: #444444;
      --oxblood: #FF6B6B; --oxblood-dark: #FF8787; --oxblood-wash: #3A1C1C;
      --green: #51CF66; --green-wash: #1B2E1D;
    }
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--paper); color:var(--ink); font-family:var(--font-sans);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding: var(--sp-5);
  }
  .card{ width:100%; max-width:420px; }
  .wordmark{ font-family:var(--font-serif); font-size:24px; font-weight:600; margin-bottom: var(--sp-2); }
  .sub{ color:var(--ink-soft); font-size:14px; line-height:1.5; margin-bottom: var(--sp-5); }
  .field{ margin-bottom: var(--sp-4); }
  .field-label{ display:block; font-family:var(--font-mono); font-size:11.5px; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-faint); margin-bottom:6px; }
  .field-hint{ font-size:12px; color:var(--ink-faint); margin-top: var(--sp-2); }
  input[type=password]{
    width:100%; background:var(--paper-raised); border:1px solid var(--rule-strong); color:var(--ink);
    font-family:var(--font-sans); font-size:14px; padding:10px 12px;
  }
  input[type=password]:focus{ outline:none; border-color:var(--oxblood); }
  .btn{
    display:inline-block; background:var(--oxblood); color:#fff; border:1px solid var(--oxblood);
    font-family:var(--font-sans); font-size:14px; font-weight:500; padding:10px 20px; cursor:pointer;
  }
  .btn:hover{ background:var(--oxblood-dark); border-color:var(--oxblood-dark); }
  .btn[disabled]{ opacity:0.45; cursor:not-allowed; }
  .callout{ border:1px solid var(--rule-strong); background:var(--paper-raised); padding: var(--sp-4); font-size:13px; color:var(--ink-soft); margin-bottom: var(--sp-4); }
  .callout.error{ border-color:var(--oxblood); background:var(--oxblood-wash); color:var(--oxblood-dark); }
  .callout.success{ border-color:var(--green); background:var(--green-wash); color:var(--green); }
</style>
</head>
<body>
<div class="card" id="root">
  <div class="wordmark">Marginalia</div>
  <p class="sub">Loading...</p>
</div>

<script type="module">
import { supabase } from './supabase.js';

const root = document.getElementById('root');
let recoveryReady = false;

function renderChecking(){
  root.innerHTML =
    '<div class="wordmark">Marginalia</div>' +
    '<p class="sub">Verifying your reset link...</p>';
}

function renderInvalid(){
  root.innerHTML =
    '<div class="wordmark">Marginalia</div>' +
    '<div class="callout error">This reset link is invalid or has expired. Request a new one from the login page.</div>' +
    '<a class="btn" href="./index.html" style="text-decoration:none;">Back to Marginalia</a>';
}

function renderForm(errorMsg){
  root.innerHTML =
    '<div class="wordmark">Marginalia</div>' +
    '<p class="sub">Choose a new password for your account.</p>' +
    (errorMsg ? '<div class="callout error">' + escHtml(errorMsg) + '</div>' : '') +
    '<div class="field">' +
      '<label class="field-label">New password</label>' +
      '<input type="password" id="pw1" placeholder="********" />' +
    '</div>' +
    '<div class="field">' +
      '<label class="field-label">Confirm new password</label>' +
      '<input type="password" id="pw2" placeholder="********" />' +
      '<div class="field-hint">At least 6 characters.</div>' +
    '</div>' +
    '<button class="btn" id="submit-btn">Update password</button>';

  document.getElementById('submit-btn').onclick = handleSubmit;
  document.getElementById('pw2').onkeydown = function(e){ if(e.key === 'Enter') handleSubmit(); };
}

function renderSuccess(){
  root.innerHTML =
    '<div class="wordmark">Marginalia</div>' +
    '<div class="callout success">Your password has been updated. You can now log in with your new password.</div>' +
    '<a class="btn" href="./index.html" style="text-decoration:none;">Go to Marginalia</a>';
}

function escHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

async function handleSubmit(){
  const pw1 = document.getElementById('pw1').value;
  const pw2 = document.getElementById('pw2').value;
  if(!pw1 || pw1.length < 6){
    renderForm('Password must be at least 6 characters.');
    return;
  }
  if(pw1 !== pw2){
    renderForm('Passwords do not match.');
    return;
  }
  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'Updating...';
  try{
    const result = await supabase.auth.updateUser({ password: pw1 });
    if(result.error) throw result.error;
    await supabase.auth.signOut();
    renderSuccess();
  }catch(e){
    renderForm(e.message || 'Something went wrong. Try requesting a new reset link.');
  }
}

// Supabase JS automatically parses the recovery token out of the URL hash
// (detectSessionInUrl is on by default) and establishes a temporary
// recovery session. We listen for that, and also check directly in case
// the event already fired before this listener was attached.
renderChecking();

supabase.auth.onAuthStateChange(function(event, session){
  if(event === 'PASSWORD_RECOVERY' && session){
    recoveryReady = true;
    renderForm();
  }
});

setTimeout(async function(){
  if(recoveryReady) return;
  const result = await supabase.auth.getSession();
  if(result.data && result.data.session){
    recoveryReady = true;
    renderForm();
  } else {
    renderInvalid();
  }
}, 1200);
</script>
</body>
</html>
