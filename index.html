<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marginalia Study App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EFEEE8;
    --paper-raised: #E5E2D9;
    --paper-deep: #DDD9CD;
    --ink: #1B1D19;
    --ink-soft: #55564E;
    --ink-faint: #86847A;
    --rule: #C9C4B4;
    --rule-strong: #A9A392;
    --oxblood: #7A1F2B;
    --oxblood-dark: #591620;
    --oxblood-wash: #F3E4E3;
    --navy: #2C3B4C;
    --green: #3F6B44;
    --green-wash: #E4EBE1;
    --amber: #8A6416;
    --amber-wash: #F1E9D6;
    
    --font-serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
    --font-sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px;
    --sp-6: 32px; --sp-7: 48px; --sp-8: 64px; --sp-9: 96px;
  }

  html.dark {
    --paper: #121212;
    --paper-raised: #1E1E1E;
    --paper-deep: #2A2A2A;
    --ink: #E0E0E0;
    --ink-soft: #A0A0A0;
    --ink-faint: #707070;
    --rule: #333333;
    --rule-strong: #444444;
    --oxblood: #FF6B6B;
    --oxblood-dark: #FF8787;
    --oxblood-wash: #3A1C1C;
    --navy: #4DABF7;
    --green: #51CF66;
    --green-wash: #1B3A22;
    --amber: #FCC419;
    --amber-wash: #3D3110;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; background: var(--paper); color: var(--ink); font-family: var(--font-sans); }

  h1,h2,h3,h4{ font-family: var(--font-serif); font-weight: 600; margin: 0; color: var(--ink); }
  p{ margin: 0; }
  a{ color: inherit; }
  button, input, select, textarea{ font-family: inherit; font-size: inherit; color: inherit; }
  button{ cursor: pointer; }
  ::selection{ background: var(--oxblood); color: var(--paper); }

  :focus-visible{ outline: 2px solid var(--navy); outline-offset: 2px; }

  .app{ max-width: 920px; margin: 0 auto; padding: 0 var(--sp-5) var(--sp-9); min-height: 100vh; }
  .app-narrow{ max-width: 640px; }

  .topbar{
    display:flex; align-items:baseline; justify-content:space-between;
    padding: var(--sp-6) 0 var(--sp-4);
    border-bottom: 1px solid var(--rule-strong);
    margin-bottom: var(--sp-6);
    flex-wrap: wrap; gap: var(--sp-3);
  }
  .wordmark{ font-family: var(--font-serif); font-size: 22px; font-weight: 700; letter-spacing: 0.2px; }
  .wordmark small{ font-family: var(--font-sans); font-weight: 500; font-size: 12px; color: var(--ink-faint); margin-left: var(--sp-2); }
  .topnav{ display:flex; align-items:center; gap: var(--sp-5); font-size: 13.5px; }
  .topnav a, .topnav button.linklike{
    background:none; border:none; padding:0; color: var(--ink-soft);
    text-decoration: none; border-bottom: 1px solid transparent;
  }
  .topnav a:hover, .topnav button.linklike:hover{ color: var(--ink); border-bottom-color: var(--ink-soft); }
  .topnav .level-badge{
    font-family: var(--font-mono); font-size: 11.5px; color: var(--navy);
    background: var(--paper-raised); padding: 3px 8px; border: 1px solid var(--rule-strong);
  }

  .btn{
    display:inline-flex; align-items:center; gap: var(--sp-2);
    border: 1px solid var(--ink); background: var(--ink); color: var(--paper);
    padding: 10px 18px; font-size: 13.5px; font-weight: 500; letter-spacing: 0.2px;
  }
  .btn:hover{ background: var(--ink-soft); border-color:var(--ink-soft); }
  .btn:active{ transform: translateY(1px); }
  .btn-primary{ background: var(--oxblood); border-color: var(--oxblood); }
  .btn-primary:hover{ background: var(--oxblood-dark); border-color: var(--oxblood-dark); color: white; }
  .btn-outline{ background: transparent; color: var(--ink); border: 1px solid var(--ink); }
  .btn-outline:hover{ background: var(--ink); color: var(--paper); }
  .btn-quiet{ background: transparent; color: var(--ink-soft); border: 1px solid var(--rule-strong); }
  .btn-quiet:hover{ background: var(--paper-raised); color: var(--ink); }
  .btn-sm{ padding: 6px 12px; font-size: 12.5px; }
  .btn[disabled]{ opacity: 0.45; cursor: not-allowed; }

  label.field-label{ display:block; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); margin-bottom: var(--sp-2); text-transform: none; }
  .field-hint{ font-size: 12px; color: var(--ink-faint); margin-top: var(--sp-2); }
  input[type=text], input[type=password], input[type=number], textarea, select{
    width: 100%; background: var(--paper); border: 1px solid var(--rule-strong);
    padding: 10px 12px; color: var(--ink);
  }
  input[type=text]:focus, input[type=password]:focus, input[type=number]:focus, textarea:focus, select:focus{
    border-color: var(--navy);
  }
  textarea{ resize: vertical; min-height: 140px; font-family: var(--font-sans); line-height:1.6; }
  .field{ margin-bottom: var(--sp-5); }
  .choice-row{ display:flex; flex-wrap:wrap; gap: var(--sp-2); }
  .choice-pill{
    border: 1px solid var(--rule-strong); background: var(--paper); padding: 8px 14px; font-size: 13px; color: var(--ink);
  }
  .choice-pill.selected{ background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .checkbox-row{ display:flex; flex-direction:column; gap: var(--sp-2); }
  .checkbox-item{ display:flex; align-items:center; gap: var(--sp-3); font-size: 13.5px; padding: 8px 0; border-bottom: 1px solid var(--rule); }
  .checkbox-item input{ width:16px; height:16px; accent-color: var(--oxblood); }

  .section-heading{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom: var(--sp-3); }
  .section-heading h2{ font-size: 19px; }
  .ledger{ border-top: 1px solid var(--rule-strong); }
  .ledger-row{
    display:flex; align-items:center; justify-content:space-between; gap: var(--sp-4);
    padding: var(--sp-4) 0; border-bottom: 1px solid var(--rule);
  }
  .ledger-row.clickable{ cursor:pointer; }
  .ledger-row.clickable:hover .ledger-title{ color: var(--oxblood); }
  .ledger-title{ font-family: var(--font-serif); font-size: 16.5px; font-weight: 600; }
  .ledger-meta{ font-size: 12.5px; color: var(--ink-faint); margin-top: 3px; }
  .ledger-meta span{ margin-right: var(--sp-4); }
  .ledger-meta .num{ font-family: var(--font-mono); color: var(--ink-soft); }
  .ledger-empty{ padding: var(--sp-6) 0; color: var(--ink-faint); font-size: 13.5px; border-bottom: 1px solid var(--rule); }

  .notes-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(230px,1fr)); gap: var(--sp-4); }
  .sticky{
    background: var(--paper-raised); border: 1px solid var(--rule-strong); border-left: 3px solid var(--amber);
    padding: var(--sp-4); min-height: 130px; display:flex; flex-direction:column; gap: var(--sp-2);
  }
  .sticky h4{ font-size: 14.5px; }
  .sticky p{ font-size: 13px; color: var(--ink-soft); line-height:1.5; }
  .stagger-in{ animation: rise 420ms ease both; }
  @keyframes rise{ from{ opacity:0; transform: translateY(6px);} to{ opacity:1; transform:none; } }

  .tabs{ display:flex; gap: var(--sp-6); border-bottom: 1px solid var(--rule-strong); margin-bottom: var(--sp-5); }
  .tab{
    background:none; border:none; padding: var(--sp-3) 0; font-size: 13.5px; font-weight: 500;
    color: var(--ink-faint); border-bottom: 2px solid transparent; margin-bottom:-1px;
  }
  .tab.active{ color: var(--ink); border-bottom-color: var(--oxblood); }
  .tab:hover{ color: var(--ink); }

  .qcard{ border-top: 1px solid var(--rule); padding: var(--sp-5) 0; }
  .qcard:last-child{ border-bottom: 1px solid var(--rule); }
  .qnum{ font-family: var(--font-mono); font-size: 12px; color: var(--ink-faint); margin-bottom: var(--sp-2); }
  .qnum-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom: var(--sp-2); gap: var(--sp-3); }
  .qnum-row .qnum{ margin-bottom:0; }
  .regen-btn{ background:none; border:none; color:var(--ink-faint); font-family:var(--font-mono); font-size:11px; cursor:pointer; white-space:nowrap; padding:0; transition: color 0.15s ease; }
  .regen-btn:hover{ color:var(--navy); }
  .regen-btn:disabled{ color:var(--ink-faint); cursor:default; font-style:italic; }
  .qtext{ font-size: 15px; margin-bottom: var(--sp-3); }
  .opt{ display:flex; align-items:center; gap: var(--sp-3); padding: 8px 0; font-size: 14px; }
  .opt input{ accent-color: var(--oxblood); width:16px; height:16px; }
  .result-tag{ font-family: var(--font-mono); font-size: 11.5px; padding: 2px 8px; border:1px solid; display:inline-block; }
  .result-tag.correct{ color: var(--green); border-color: var(--green); background: var(--green-wash); }
  .result-tag.incorrect{ color: var(--oxblood); border-color: var(--oxblood); background: var(--oxblood-wash); }
  .result-tag.partial{ color: var(--amber); border-color: var(--amber); background: var(--amber-wash); }
  .feedback-line{ font-size: 13px; color: var(--ink-soft); margin-top: var(--sp-2); padding-left: var(--sp-3); border-left: 2px solid var(--rule-strong); }

  .score-block{
    border: 1px solid var(--ink); padding: var(--sp-6); text-align:center; margin-bottom: var(--sp-6);
  }
  .score-num{ font-family: var(--font-mono); font-size: 44px; font-weight: 500; line-height:1; }
  .score-label{ font-size: 12.5px; color: var(--ink-faint); margin-top: var(--sp-2); letter-spacing: 0.3px; }
  .score-letter{ font-family: var(--font-serif); font-size: 22px; color: var(--oxblood); margin-top: var(--sp-3); }

  .hist-row{ border-bottom: 1px solid var(--rule); padding: var(--sp-4) 0; display:flex; justify-content:space-between; align-items:center; }
  .hist-type{ font-family: var(--font-mono); font-size: 11px; color: var(--navy); border: 1px solid var(--navy); padding: 2px 7px; margin-right: var(--sp-3); }
  .hist-score{ font-family: var(--font-mono); font-size: 15px; }
  #stats-chart { background: var(--paper-raised); padding: 10px; border-radius: 8px; margin-bottom: var(--sp-5); max-width: 100%; height: 250px;}

  .muted{ color: var(--ink-faint); }
  .divider{ border: none; border-top: 1px solid var(--rule); margin: var(--sp-6) 0; }
  .callout{ border: 1px solid var(--rule-strong); background: var(--paper-raised); padding: var(--sp-4); font-size: 13px; color: var(--ink-soft); }
  .callout.warn{ border-color: var(--amber); background: var(--amber-wash); color: #5c4711; }
  .callout.error{ border-color: var(--oxblood); background: var(--oxblood-wash); color: var(--oxblood-dark); }
  .callout.success{ border-color: var(--green); background: var(--green-wash); color: var(--green); }
  .danger-zone{ }
  .danger-btn{ border-color: var(--oxblood); color: var(--oxblood); background: var(--paper); }
  .danger-btn:hover{ background: var(--oxblood); color: #fff; }
  .btn.danger-btn{ border:1px solid var(--oxblood); }
  .clone-banner{ display:flex; justify-content:space-between; align-items:center; gap: var(--sp-4); margin-bottom: var(--sp-5); }
  .upload-list{ margin-top: var(--sp-3); display:flex; flex-direction:column; gap:6px; }
  .upload-item{ display:flex; justify-content:space-between; align-items:center; font-size: 12.5px; background: var(--paper-raised); border:1px solid var(--rule-strong); padding: 6px 10px; }
  .upload-item button{ background:none; border:none; color: var(--oxblood); font-size:12px; padding:0; }
  .dropzone{ border: 1px dashed var(--rule-strong); padding: var(--sp-5); text-align:center; font-size:13px; color: var(--ink-faint); }
  .dropzone.drag{ border-color: var(--navy); color: var(--navy); }

  .grade-table{ width:100%; border-collapse: collapse; font-size: 13px; }
  .grade-table th{ text-align:left; font-weight:600; color: var(--ink-soft); font-size:11.5px; padding-bottom: var(--sp-2); border-bottom: 1px solid var(--rule-strong); }
  .grade-table td{ padding: 6px 0; border-bottom: 1px solid var(--rule); }
  .grade-table input{ padding: 6px 8px; }

  .loading-overlay{
    position: fixed; inset:0; background: rgba(0,0,0,0.8); z-index: 50;
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap: var(--sp-4);
  }
  .loading-mark{ width: 36px; height: 2px; background: var(--oxblood); animation: sweep 1.1s ease-in-out infinite; }
  @keyframes sweep{ 0%{ transform: scaleX(0.3); opacity:0.5;} 50%{ transform: scaleX(1); opacity:1;} 100%{ transform: scaleX(0.3); opacity:0.5;} }
  .loading-text{ font-family: var(--font-serif); font-size: 15px; color: #FFF; }

  .onboard-wrap{ padding-top: var(--sp-7); }
  .onboard-wrap .wordmark{ font-size: 30px; margin-bottom: var(--sp-2); }
  .onboard-sub{ color: var(--ink-soft); font-size: 14px; margin-bottom: var(--sp-6); max-width: 460px; }
  .footer-note{ margin-top: var(--sp-9); padding-top: var(--sp-4); border-top: 1px solid var(--rule); font-size: 11.5px; color: var(--ink-faint); }

  /* ── Landing page ── */
  html{ scroll-behavior: smooth; }
  .landing{ max-width: 1000px; margin: 0 auto; padding: 0 var(--sp-5); }
  .landing-hero{ position:relative; text-align:center; padding: var(--sp-9) 0 var(--sp-7); border-bottom: 1px solid var(--rule); overflow:hidden; }
  .landing-rule-motif{
    position:absolute; top:0; left:50%; transform:translateX(-50%); width:100%; max-width:1000px; height:100%;
    pointer-events:none; z-index:0;
    background-image:
      radial-gradient(ellipse 480px 260px at 50% 0%, var(--oxblood-wash) 0%, transparent 70%),
      repeating-linear-gradient(180deg, transparent, transparent 27px, var(--rule) 28px, transparent 29px);
    background-repeat: no-repeat, repeat-y;
    background-position: center top, 0 0;
    opacity:0.7;
    -webkit-mask-image: linear-gradient(180deg, black, transparent 92%);
    mask-image: linear-gradient(180deg, black, transparent 92%);
  }
  .landing-hero > *{ position:relative; z-index:1; }
  .landing-eyebrow{ font-family: var(--font-mono); font-size:11.5px; letter-spacing:2.5px; color: var(--oxblood); margin-bottom: var(--sp-3); }
  .landing-tagline{ font-family: var(--font-serif); font-size: 24px; color: var(--ink); max-width: 600px; margin: var(--sp-4) auto var(--sp-3); line-height:1.35; }
  .landing-sub{ color: var(--ink-soft); font-size: 14.5px; max-width: 540px; margin: 0 auto var(--sp-5); line-height:1.65; }
  .landing-badges{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom: var(--sp-6); }
  .landing-badge{ font-family: var(--font-mono); font-size:11px; letter-spacing:0.3px; color: var(--navy); border:1px solid var(--rule-strong); background: var(--paper-raised); padding:5px 12px; }
  .landing-cta-row{ display:flex; gap: var(--sp-3); justify-content:center; margin-bottom: var(--sp-5); }
  .landing-btn-lg{ padding: 13px 28px; font-size:14.5px; transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease; }
  .landing-btn-lg:hover{ transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.15); }
  .landing-btn-lg:active{ transform: translateY(0); }
  .landing-scroll-hint{ display:inline-flex; flex-direction:column; align-items:center; gap:4px; font-family: var(--font-mono); font-size: 12px; letter-spacing:0.3px; color: var(--ink-faint); text-decoration:none; transition: color 0.15s ease; }
  .landing-scroll-hint:hover{ color: var(--oxblood); }
  .landing-scroll-arrow{ animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(4px); } }
  .landing-features{ padding: var(--sp-8) 0; }
  .feature-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: var(--sp-4); }
  .feature-card{ position:relative; border:1px solid var(--rule-strong); background: var(--paper-raised); padding: var(--sp-5); transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease; }
  .feature-card:hover{ transform: translateY(-3px); border-color: var(--oxblood); box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
  .feature-num{ font-family: var(--font-mono); font-size:11px; color: var(--ink-faint); letter-spacing:1px; margin-bottom: var(--sp-2); }
  .feature-card h3{ font-family: var(--font-serif); font-size: 16px; margin-bottom: var(--sp-2); }
  .feature-card p{ color: var(--ink-soft); font-size: 13.5px; line-height:1.6; margin:0; }

  /* ── First-time product tour ── */
  .tour-highlight{ position:fixed; border-radius:4px; box-shadow: 0 0 0 9999px rgba(0,0,0,0.6); border:2px solid var(--oxblood); z-index:200; pointer-events:none; transition: top 0.25s ease, left 0.25s ease, width 0.25s ease, height 0.25s ease; }
  .tour-tooltip{ position:fixed; z-index:201; background:var(--paper); border:1px solid var(--rule-strong); padding: var(--sp-4); box-shadow:0 6px 24px rgba(0,0,0,0.35); }
  .tour-step-count{ font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); letter-spacing:0.4px; margin-bottom:6px; }
  .tour-tooltip h4{ font-family:var(--font-serif); font-size:15px; margin-bottom:6px; }
  .tour-tooltip p{ font-size:13px; color:var(--ink-soft); line-height:1.5; margin-bottom: var(--sp-3); }
  .tour-actions{ display:flex; justify-content:space-between; align-items:center; }

  @media (max-width: 560px){
    .app{ padding: 0 var(--sp-4) var(--sp-8); }
    .topbar{ padding: var(--sp-4) 0 var(--sp-3); gap: var(--sp-2); }
    .wordmark small{ display:none; } /* subtitle drops on mobile to save space */
    .topnav{ gap: var(--sp-4); font-size: 13px; width:100%; justify-content:space-between; flex-wrap: wrap; row-gap: var(--sp-2); }

    .landing{ padding: 0 var(--sp-4); }
    .landing-hero{ padding: var(--sp-7) 0 var(--sp-6); }
    .landing-tagline{ font-size: 18px; }
    .landing-eyebrow{ letter-spacing:1.5px; font-size:10.5px; }
    .landing-badges{ gap:6px; }
    .landing-badge{ font-size:10px; padding:4px 9px; }
    .landing-cta-row{ flex-direction: column; }
    .landing-cta-row .btn{ width: 100%; }
    .feature-grid{ grid-template-columns: 1fr; }

    .notes-grid{ grid-template-columns: 1fr; }

    /* Inputs at 16px prevents iOS Safari auto-zooming the page on focus */
    input[type=text], input[type=password], input[type=number], textarea, select{
      font-size: 16px;
    }

    /* Tabs scroll horizontally instead of wrapping/crushing on narrow screens */
    .tabs{ gap: var(--sp-4); overflow-x: auto; -webkit-overflow-scrolling: touch; flex-wrap: nowrap; padding-bottom: 1px; }
    .tab{ flex-shrink: 0; white-space: nowrap; font-size: 13px; }

    /* Ledger rows stack instead of squeezing title + delete button onto one line */
    .ledger-row{ flex-direction: column; align-items: stretch; gap: var(--sp-2); }
    .ledger-row .btn-sm[data-delete-set]{ align-self: flex-start; }
    .ledger-meta span{ display:inline-block; margin-right: var(--sp-3); margin-bottom: 2px; }

    /* Dashboard quick-action buttons become full-width, easier to tap */
    .dash-actions{ flex-direction: column; }
    .dash-actions .btn{ width: 100%; justify-content: center; }

    /* Progress bar / timer wraps instead of overlapping */
    .quiz-progress-label{ flex-wrap: wrap; gap: 6px; }

    /* Slightly denser stat cards so 2 columns fit on narrow phones */
    .stats-cards{ grid-template-columns: repeat(auto-fit, minmax(128px,1fr)); }
    .stats-chart-wrap{ height: 220px; }

    /* Flashcards a touch shorter so they fit comfortably above the fold */
    .flashcard-wrap{ height: 190px; }
    .fc-nav{ gap: var(--sp-2); }
    .fc-counter{ font-size: 11.5px; }

    /* Comprehensive exam / stats set-picker chips wrap tighter */
    .stats-set-list, .tag-filter-row{ gap: 6px; }

    /* Setup panels (quiz/test/exam customization) go single-column */
    .setup-grid{ grid-template-columns: 1fr; }

    /* Tutor drawer takes the full screen width instead of a side panel feel */
    .tutor-drawer{ width: 100vw; max-width: 100vw; }

    /* Bigger, easier tap targets throughout */
    .btn{ padding: 11px 16px; }
    .choice-pill{ padding: 9px 14px; }
    .tab{ padding: var(--sp-3) 4px; }

    h2{ font-size: 18px; }
    .section-heading h2{ font-size: 17px; }
    .ledger-title{ font-size: 15.5px; }
  }

  @media (max-width: 380px){
    .app{ padding: 0 var(--sp-3) var(--sp-7); }
    .stats-cards{ grid-template-columns: 1fr 1fr; }
    .wordmark{ font-size: 19px; }
  }

  /* ── Flashcard reviewer ── */
  .flashcard-wrap{ perspective: 1000px; width:100%; max-width:520px; height:220px; cursor:pointer; margin: 0 auto var(--sp-5); }
  .flashcard-inner{ position:relative; width:100%; height:100%; transform-style: preserve-3d; transition: transform 0.45s ease; }
  .flashcard-wrap.flipped .flashcard-inner{ transform: rotateY(180deg); }
  .flashcard-face{
    position:absolute; inset:0; backface-visibility:hidden;
    border: 1px solid var(--rule-strong); background: var(--paper-raised);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: var(--sp-5); text-align:center; gap: var(--sp-3);
  }
  .flashcard-face.back{ transform: rotateY(180deg); background: var(--paper-deep); border-left: 3px solid var(--green); }
  .flashcard-face .fc-label{ font-family: var(--font-mono); font-size:11px; color: var(--ink-faint); letter-spacing:0.5px; }
  .flashcard-face .fc-text{ font-family: var(--font-serif); font-size:18px; line-height:1.45; color: var(--ink); }
  .flashcard-face.back .fc-text{ font-size:15px; color: var(--ink-soft); }
  .fc-nav{ display:flex; align-items:center; justify-content:center; gap: var(--sp-4); margin-bottom: var(--sp-4); }
  .fc-counter{ font-family: var(--font-mono); font-size:13px; color: var(--ink-faint); }
  .fc-actions{ display:flex; gap: var(--sp-3); justify-content:center; margin-bottom: var(--sp-5); }

  /* ── Quiz progress bar ── */
  .quiz-progress{ margin-bottom: var(--sp-4); }
  .quiz-progress-label{ display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:11.5px; color:var(--ink-faint); margin-bottom: var(--sp-2); }
  .quiz-progress-track{ height:3px; background:var(--rule); }
  .quiz-progress-fill{ height:3px; background:var(--oxblood); transition: width 0.3s ease; }

  /* ── Streak / activity on dashboard ── */
  .streak-section{ margin-bottom: var(--sp-6); }
  .streak-bar{ display:flex; align-items:center; gap: var(--sp-3); padding: var(--sp-3) 0 var(--sp-4); margin-bottom: var(--sp-3); border-bottom: 1px solid var(--rule); }
  .streak-flame{ font-size:20px; }
  .streak-count{ font-family: var(--font-mono); font-size:22px; font-weight:500; color: var(--amber); }
  .streak-label{ font-size:12.5px; color: var(--ink-faint); }
  .activity-heatmap{ display:flex; gap:4px; flex-wrap:wrap; margin-top: var(--sp-2); }
  .hm-cell{ width:12px; height:12px; background: var(--paper-raised); border:1px solid var(--rule); flex-shrink:0; }
  .hm-cell.active-1{ background: var(--amber-wash); border-color: var(--amber); }
  .hm-cell.active-2{ background: #d4a84b; border-color: var(--amber); }
  .hm-cell.active-3{ background: var(--amber); border-color: var(--amber-dark,#6b4d12); }
  .hm-cell.today{ outline: 2px solid var(--navy); outline-offset:1px; }

  /* ── Weak-concept breakdown ── */
  .weak-row{ display:flex; align-items:center; justify-content:space-between; padding: var(--sp-3) 0; border-bottom:1px solid var(--rule); font-size:13.5px; }
  .weak-topic{ font-family:var(--font-serif); font-size:14px; }
  .weak-bar-wrap{ flex:1; margin:0 var(--sp-4); height:6px; background:var(--rule); }
  .weak-bar-fill{ height:6px; background:var(--oxblood); }
  .weak-pct{ font-family:var(--font-mono); font-size:12.5px; color:var(--ink-soft); min-width:36px; text-align:right; }

  /* ── Difficulty badge on dashboard ── */
  .diff-badge{ font-family:var(--font-mono); font-size:10.5px; padding:2px 7px; border:1px solid var(--green); color:var(--green); background:var(--green-wash); display:inline-block; }
  .diff-badge.hard{ border-color:var(--oxblood); color:var(--oxblood); background:var(--oxblood-wash); }
  .diff-badge.medium{ border-color:var(--amber); color:var(--amber); background:var(--amber-wash); }

  /* ── Rubric reveal block ── */
  .rubric-reveal{ margin-top:var(--sp-3); }
  .rubric-reveal summary{ font-size:12.5px; color:var(--navy); cursor:pointer; list-style:none; display:inline-flex; align-items:center; gap:4px; }
  .rubric-reveal summary::-webkit-details-marker{ display:none; }
  .rubric-reveal summary::before{ content:'▶'; font-size:9px; transition: transform 0.2s; }
  details[open] .rubric-reveal summary::before{ transform: rotate(90deg); }

  /* ── Step-by-step solutions ── */
  .step-solution{ margin-top:8px; border:1px solid var(--rule-strong); background:var(--paper-raised); padding: var(--sp-3) var(--sp-4); }
  .step-loading{ font-size:12.5px; color:var(--ink-faint); font-style:italic; }
  .step-list{ margin:0; padding-left:1.2em; font-size:13px; color:var(--ink-soft); line-height:1.65; }
  .step-list li{ margin-bottom:6px; }
  .step-list li:last-child{ margin-bottom:0; font-weight:600; color:var(--ink); }

  /* ── Stats page ── */
  .stats-select-panel{ border:1px solid var(--rule-strong); background:var(--paper-raised); padding: var(--sp-4); margin-bottom: var(--sp-5); }
  .stats-select-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom: var(--sp-3); }
  .stats-select-head h4{ font-family:var(--font-serif); font-size:14px; font-weight:600; }
  .stats-select-actions{ display:flex; gap: var(--sp-3); }
  .stats-select-actions button{ background:none; border:none; color:var(--navy); font-size:12px; text-decoration:underline; cursor:pointer; padding:0; }
  .stats-set-list{ display:flex; flex-wrap:wrap; gap: var(--sp-2); }
  .stats-set-chip{ display:flex; align-items:center; gap:6px; border:1px solid var(--rule-strong); padding: 6px 10px; cursor:pointer; font-size:12.5px; background:var(--paper); }
  .stats-set-chip.selected{ border-color:var(--navy); background: var(--paper-deep); }
  .stats-set-chip .chip-cat{ font-family:var(--font-mono); font-size:10px; color:var(--ink-faint); border-left:1px solid var(--rule); padding-left:6px; margin-left:2px; }
  .stats-cards{ display:grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: var(--sp-3); margin-bottom: var(--sp-6); }
  .stats-card{ border:1px solid var(--rule-strong); background:var(--paper-raised); padding: var(--sp-4); text-align:center; }
  .stats-card .num{ font-family:var(--font-mono); font-size:26px; color:var(--oxblood); display:block; margin-bottom:4px; }
  .stats-card .lbl{ font-size:11.5px; color:var(--ink-faint); letter-spacing:0.3px; }
  .stats-chart-block{ margin-bottom: var(--sp-6); }
  .stats-chart-block h4{ font-family:var(--font-serif); font-size:14.5px; margin-bottom: var(--sp-3); }
  .stats-chart-wrap{ position:relative; height:260px; }
  .stats-empty{ padding: var(--sp-6); text-align:center; color:var(--ink-faint); border:1px dashed var(--rule-strong); }

  /* ── Cloze deletion (Active Recall Mode) ── */
  .cloze-blank{ display:inline-block; background: var(--paper-deep); border:1px solid var(--navy); color: var(--navy); font-family: var(--font-mono); font-size: 0.92em; padding: 1px 8px; cursor:pointer; user-select:none; }
  .cloze-blank.revealed{ background:none; border:none; color: var(--oxblood); font-family: var(--font-serif); padding:0; cursor:default; font-weight:600; }

  /* ── Socratic Tutor Drawer ── */
  .tutor-scrim{ position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:90; }
  .tutor-drawer{ position:fixed; top:0; right:0; bottom:0; width:420px; max-width:92vw; background:var(--paper); border-left:1px solid var(--rule-strong); z-index:91; display:flex; flex-direction:column; box-shadow:-4px 0 20px rgba(0,0,0,0.15); }
  .tutor-head{ padding: var(--sp-4) var(--sp-5); border-bottom:1px solid var(--rule); display:flex; justify-content:space-between; align-items:flex-start; gap: var(--sp-3); }
  .tutor-head h4{ font-family:var(--font-serif); font-size:15px; margin-bottom:4px; }
  .tutor-head .qref{ font-size:12px; color:var(--ink-faint); line-height:1.4; }
  .tutor-close{ background:none; border:none; font-size:20px; line-height:1; cursor:pointer; color:var(--ink-faint); padding:0; }
  .tutor-quick{ padding: var(--sp-3) var(--sp-5); display:flex; flex-direction:column; gap:6px; border-bottom:1px solid var(--rule); }
  .tutor-quick button{ text-align:left; background:var(--paper-raised); border:1px solid var(--rule-strong); padding:8px 10px; font-size:12.5px; cursor:pointer; color:var(--ink); }
  .tutor-quick button:hover{ border-color:var(--navy); }
  .tutor-messages{ flex:1; overflow-y:auto; padding: var(--sp-4) var(--sp-5); display:flex; flex-direction:column; gap: var(--sp-3); }
  .tutor-msg{ font-size:13.5px; line-height:1.55; max-width:92%; }
  .tutor-msg.user{ align-self:flex-end; background:var(--paper-deep); border:1px solid var(--rule-strong); padding:8px 12px; }
  .tutor-msg.assistant{ align-self:flex-start; padding: 2px 0; color: var(--ink-soft); }
  .tutor-input-row{ padding: var(--sp-3) var(--sp-5); border-top:1px solid var(--rule); display:flex; gap: var(--sp-2); }
  .tutor-input-row input{ flex:1; }
  .tutor-typing{ font-size:12px; color:var(--ink-faint); font-style:italic; }

  /* ── Dashboard quick actions ── */
  .dash-actions{ display:flex; gap: var(--sp-3); margin-top: var(--sp-2); margin-bottom: var(--sp-6); flex-wrap:wrap; }
  .due-badge{ display:inline-block; background: var(--paper); color: var(--oxblood); border-radius:10px; padding:1px 7px; font-size:11px; font-family:var(--font-mono); margin-left:6px; }

  /* ── Public Explore space ── */
  .explore-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(240px,1fr)); gap: var(--sp-4); margin-top: var(--sp-4); }
  .explore-card{ border:1px solid var(--rule-strong); background:var(--paper-raised); padding: var(--sp-4); cursor:pointer; transition: border-color 0.15s; }
  .explore-card:hover{ border-color: var(--navy); }
  .explore-card-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom: var(--sp-2); }
  .explore-card h4{ font-family:var(--font-serif); font-size:15px; margin:4px 0 6px; }
  .explore-meta{ font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); }
  .explore-badge{ font-family:var(--font-mono); font-size:10px; padding:2px 7px; border:1px solid var(--green); color:var(--green); background:var(--green-wash); white-space:nowrap; }
  .explore-badge.viewonly{ border-color:var(--amber); color:var(--amber); background:var(--amber-wash); }
  .explore-desc{ font-size:12.5px; color:var(--ink-soft); line-height:1.5; margin:4px 0 8px; }
  .explore-profile-card{ border:1px solid var(--rule-strong); background:var(--paper-raised); padding: var(--sp-4); margin-bottom: var(--sp-5); }
  .explore-profile-name{ font-family:var(--font-serif); font-size:17px; margin-bottom:4px; }
  .my-upload-row{ display:flex; border-bottom:1px solid var(--rule); padding: var(--sp-4) 0; }
  .cloned-from-tag{ font-family:var(--font-mono); font-size:11px; color:var(--navy); margin-top:4px; }
  .chip-cat{ font-family:var(--font-mono); font-size:10px; color:var(--ink-faint); border:1px solid var(--rule-strong); padding:2px 7px; }

  /* ── Dashboard organization: search / tags / grouping ── */
  .dash-organize{ margin-bottom: var(--sp-5); }
  .dash-search-input{ width:100%; margin-bottom: var(--sp-3); }
  .tag-filter-row{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom: var(--sp-3); }
  .tag-chip{ font-family:var(--font-mono); font-size:11px; padding:3px 9px; border:1px solid var(--rule-strong); background:var(--paper-raised); color:var(--ink-soft); cursor:pointer; }
  .tag-chip.selected{ border-color:var(--navy); color:var(--navy); background:var(--paper-deep); }
  .tag-chip-clear{ background:none; border:none; color:var(--oxblood); text-decoration:underline; font-size:11.5px; cursor:pointer; padding:2px 4px; }
  .set-group{ margin-bottom: var(--sp-5); }
  .set-group-heading{ font-family:var(--font-mono); font-size:12px; letter-spacing:0.4px; color:var(--ink-faint); text-transform:uppercase; padding: var(--sp-2) 0; border-bottom:1px solid var(--rule); margin-bottom:2px; }
  .ledger-tags{ display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
  .tag-pill{ font-family:var(--font-mono); font-size:10.5px; padding:2px 7px; border:1px solid var(--rule-strong); color:var(--ink-soft); background:var(--paper); }
  .tag-edit-btn{ background:none; border:none; color:var(--navy); font-size:11px; text-decoration:underline; cursor:pointer; padding:0; margin-top:6px; }
  .tag-edit-row{ margin-top:8px; display:flex; gap:8px; align-items:center; }
  .tag-edit-row input{ flex:1; font-size:12.5px; padding:6px 8px; }

  /* ── Quiz/Test setup panels ── */
  .setup-panel{ border:1px solid var(--rule-strong); background:var(--paper-raised); padding: var(--sp-5); margin-bottom: var(--sp-5); }
  .setup-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: var(--sp-4); margin-bottom: var(--sp-4); }
  .type-check-row{ display:flex; flex-direction:column; gap: var(--sp-2); }
  .type-check-row label{ display:flex; align-items:center; gap:8px; font-size:13.5px; cursor:pointer; }
  .timer-pin{ display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:14px; border:1px solid var(--rule-strong); padding: 4px 10px; }
  .timer-pin.timer-warn{ border-color:var(--oxblood); color:var(--oxblood); }
  .quiz-progress-label .timer-pin{ margin-left:auto; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script type="module">
import { supabase } from './supabase.js';

(function(){

const S = {
  profile: null,
  apiKey: '',
  model: 'gemini-3.6-flash',
  studySets: [],
  route: 'loading',
  authMode: 'signup',
  currentSetId: null,
  currentTab: 'notes',
  newSet: null,
  quizSession: null,
  testSession: null,
  loading: false,
  loadingMsg: '',
  error: null,
  darkMode: localStorage.getItem('darkMode') === 'true',
  reviewNotifsEnabled: localStorage.getItem('reviewNotifsEnabled') === 'true',
  modelFallbackModal: null,
  supabaseClient: supabase,
  // flashcard reviewer
  flashcardIdx: 0,
  flashcardFlipped: false,
  flashcardDone: [],   // 'got' | 'review'
  // current tab sub-mode: 'grid' | 'flashcards'
  notesMode: 'grid',
  // stats page: which study set ids are included
  statsSelectedSetIds: null,
  activeRecallMode: false,
  tutorDrawer: null,
  examBuilderSelectedIds: [],
  // public Explore space
  exploreSets: [],
  exploreLoading: false,
  exploreSearch: '',
  exploreDetailId: null,
  exploreTab: 'browse', // 'browse' | 'myuploads'
  myUploads: [],
  myUploadsLoading: false,
  editingPublishedId: null,
  publishPanelOpen: false,
  publishCopyable: true,
  publishDescription: '',
  publishAnonymous: false,
  recentCloneInfo: null, // { title, author } shown as a dismissible banner on the dashboard right after cloning
  stepSolutions: {}, // key `${source}_${idx}` -> { open, loading, steps, error }
  regenerating: {}, // key `${source}_${idx}` -> boolean, question regeneration in flight
  deleteAccountOpen: false,
  _pwChangeError: null,
  _pwChangeSuccess: false,
  _deleteError: null,
  tourActive: false,
  tourStep: 0,
  comprehensiveSession: null,
  customTestSession: null,
  // dashboard organization: search / tag filter / grouping / inline tag editor
  dashboardSearch: '',
  dashboardActiveTags: [],
  dashboardGroupBy: 'none', // 'none' | 'category'
  editingTagsSetId: null,
  historySortBy: 'date',   // 'date' | 'score'
  historyDetailIdx: null,
};

const PRESET_API_KEYS = [
  'AQ.Ab8RN6JSEwHOge-XP7-dbrOBOCbbQlabvPwgbst0u1E0N494_g',
  'AQ.Ab8RN6Lycttj8QNICVyHO9n6QN6JHR6AaJu1gZ5WWOujxUAWag',
  'AQ.Ab8RN6Ku-yDZ0iCjCzx-g1m62qUEyDHoXtz0GgbXbi0TXTBrJA'
];

function applyDarkMode() {
  if (S.darkMode) document.documentElement.classList.add('dark');
  else document.documentElement.classList.remove('dark');
}
applyDarkMode();

const SAFE_FALLBACK_MODEL = 'gemini-3.6-flash';
const FALLBACK_MODELS = [
  { id: 'gemini-3.6-flash', label: 'Gemini 3.6 Flash' },
  { id: 'gemini-3.5-flash', label: 'Gemini 3.5 Flash' },
  { id: 'gemini-3.5-flash-lite', label: 'Gemini 3.5 Flash-Lite' },
];

const PRESET_SCALES = {
  standard: [ {label:'A', min:90}, {label:'B', min:80}, {label:'C', min:70}, {label:'D', min:60}, {label:'F', min:0} ],
  plusminus: [
    {label:'A',min:93},{label:'A-',min:90},{label:'B+',min:87},{label:'B',min:83},{label:'B-',min:80},
    {label:'C+',min:77},{label:'C',min:73},{label:'C-',min:70},{label:'D+',min:67},{label:'D',min:63},
    {label:'D-',min:60},{label:'F',min:0}
  ],
  passfail: [ {label:'Pass', min:60}, {label:'Fail', min:0} ],
};

function defaultGradeScale(){ return { mode:'preset', preset:'standard', custom: PRESET_SCALES.standard.slice() }; }

function activeScaleTable(){
  const gs = S.profile?.gradeScale || defaultGradeScale();
  if(gs.mode === 'custom') return gs.custom.slice().sort((a,b)=>b.min-a.min);
  return (PRESET_SCALES[gs.preset] || PRESET_SCALES.standard).slice();
}
function letterFor(pct){
  const table = activeScaleTable();
  for(const row of table){ if(pct >= row.min) return row.label; }
  return table[table.length-1]?.label || '';
}

function exportStudyDataToJSON() {
    const appData = {
        profile: S.profile,
        studySets: S.studySets
    };
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 4));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", "marginalia_backup.json");
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
}

async function loadAll(){
  if(!S.supabaseClient){
    S.route = 'landing';
    render();
    return;
  }

  try {
    const { data: { session } } = await S.supabaseClient.auth.getSession();
    if(!session){
      S.profile = null;
      S.route = 'landing';
      render();
      return;
    }

    const userId = session.user.id;
    const { data: profileData, error: profileErr } = await S.supabaseClient
      .from('profiles')
      .select('*')
      .eq('id', userId)
      .single();

    if(profileErr || !profileData){
      S.profile = null;
      S.route = 'onboarding';
      render();
      return;
    }

    S.profile = {
      name: profileData.name,
      level: profileData.level,
      gradeScale: profileData.grade_scale || defaultGradeScale(),
      language: profileData.language || 'english'
    };
    S.apiKey = profileData.api_key || '';
    S.model = profileData.model || 'gemini-3.6-flash';

    const { data: setsData, error: setsErr } = await S.supabaseClient
      .from('study_sets')
      .select('*')
      .eq('user_id', userId)
      .order('updated_at', { ascending: false });

    let sets = [];
    if(setsData){
      for(const s of setsData){
        const [snRes, qRes, hRes] = await Promise.all([
          S.supabaseClient.from('sticky_notes').select('id, title, body, box_level, next_review').eq('study_set_id', s.id),
          S.supabaseClient.from('quizzes').select('type, question, options, answer, topic, explanation').eq('study_set_id', s.id),
S.supabaseClient.from('history').select('type, score_text, pct, letter, timestamp, details').eq('study_set_id', s.id).order('timestamp', { ascending: true })
        ]);

        sets.push({
          id: s.id,
          title: s.title,
          notesSummary: s.notes_summary,
          category: s.category || 'General',
          tags: Array.isArray(s.tags) ? s.tags : [],
          clonedFromTitle: s.cloned_from_title || null,
          clonedFromAuthor: s.cloned_from_author || null,
          quizSettings: s.quiz_settings || null,
          testSettings: s.test_settings || null,
          customTestSettings: s.customtest_settings || null,
          createdAt: new Date(s.created_at).getTime(),
          updatedAt: new Date(s.updated_at).getTime(),
          stickyNotes: (snRes.data || []).map(sn => ({
            id: sn.id,
            title: sn.title,
            body: sn.body,
            boxLevel: sn.box_level || 0,
            nextReview: sn.next_review ? new Date(sn.next_review).getTime() : 0
          })),
          quiz: qRes.data || [],
          history: (hRes.data || []).map(h => ({
            type: h.type,
            scoreText: h.score_text,
            pct: h.pct,
            letter: h.letter,
            timestamp: h.timestamp,
            details: h.details || null,
          }))
        });
      }
    }

    S.studySets = sets;
    if(!S.statsSelectedSetIds) S.statsSelectedSetIds = sets.map(s=>s.id);
    S.route = 'dashboard';
    
    if(sets.length === 0){
      await checkAndRunLocalStorageMigration(userId);
    }

    checkAndNotifyDueCards(false);
    startReviewNotifTimer();

  } catch(e) {
    console.error('Load all error', e);
    S.route = 'onboarding';
  }
  render();
}

async function checkAndRunLocalStorageMigration(userId){
  try {
    const localProfile = localStorage.getItem('profile');
    if(!localProfile) return;
    const parsedProf = JSON.parse(localProfile);
    const indexKey = 'studysets:index:' + parsedProf.name;
    const localIndex = JSON.parse(localStorage.getItem(indexKey) || '[]');
    
    if(localIndex.length > 0){
      S.loading = true;
      S.loadingMsg = 'Migrating existing local study sets to Supabase...';
      render();

      for(const id of localIndex){
        const setKey = 'studyset:' + parsedProf.name + ':' + id;
        const setObj = JSON.parse(localStorage.getItem(setKey));
        if(!setObj) continue;

        await S.supabaseClient.from('study_sets').upsert({
          id: setObj.id,
          user_id: userId,
          title: setObj.title,
          notes_summary: setObj.notesSummary,
          category: setObj.category || 'General',
          tags: setObj.tags || [],
          created_at: new Date(setObj.createdAt || Date.now()).toISOString(),
          updated_at: new Date(setObj.updatedAt || Date.now()).toISOString()
        });

        if(setObj.stickyNotes?.length){
          const snRows = setObj.stickyNotes.map(sn => ({ study_set_id: setObj.id, title: sn.title, body: sn.body, box_level: sn.boxLevel || 0, next_review: new Date(sn.nextReview || Date.now()).toISOString() }));
          await S.supabaseClient.from('sticky_notes').insert(snRows);
        }

        if(setObj.quiz?.length){
          const qRows = setObj.quiz.map(q => ({ study_set_id: setObj.id, type: q.type, question: q.question, options: q.options || [], answer: q.answer, topic: q.topic || null, explanation: q.explanation || null }));
          await S.supabaseClient.from('quizzes').insert(qRows);
        }

        if(setObj.history?.length){
          const hRows = setObj.history.map(h => ({ study_set_id: setObj.id, user_id: userId, type: h.type, score_text: h.scoreText, pct: h.pct, letter: h.letter, timestamp: h.timestamp }));
          await S.supabaseClient.from('history').insert(hRows);
        }
      }

      await loadAll();
    }
  } catch(e) {
    console.error('Migration error', e);
  } finally {
    S.loading = false;
  }
}

/**
 * Deletes everything this account owns that the client is able to delete
 * under RLS (study sets and their sticky notes/quizzes/history, anything
 * published to Explore, and the profile row), then signs out.
 *
 * IMPORTANT LIMITATION: this does NOT delete the underlying Supabase Auth
 * user record itself - only Supabase's admin API (service-role key, which
 * must never be used client-side) can do that. After this runs, the
 * account's login credentials still technically exist, but every trace of
 * the person's data is gone and they're signed out. This is disclosed to
 * the user in the confirmation UI.
 */
async function deleteAccountCascade(){
  if(!S.supabaseClient) return;
  const { data: { session } } = await S.supabaseClient.auth.getSession();
  if(!session) return;
  const userId = session.user.id;

  const setIds = S.studySets.map(s => s.id);
  if(setIds.length){
    await S.supabaseClient.from('quizzes').delete().in('study_set_id', setIds);
    await S.supabaseClient.from('sticky_notes').delete().in('study_set_id', setIds);
    await S.supabaseClient.from('history').delete().in('study_set_id', setIds);
    await S.supabaseClient.from('study_sets').delete().in('id', setIds);
  }
  await S.supabaseClient.from('published_sets').delete().eq('author_id', userId);
  await S.supabaseClient.from('profiles').delete().eq('id', userId);
  await S.supabaseClient.auth.signOut();

  S.profile = null;
  S.studySets = [];
  S.route = 'landing';
  render();
}

// ── Streak & activity helpers ──
function computeStreakFromHistory(allHistory){
  // allHistory = flat array of {timestamp} from all study sets
  if(!allHistory || allHistory.length === 0) return { streak: 0, activityDays: new Set() };
  const daySet = new Set(allHistory.map(h => {
    const d = new Date(h.timestamp);
    return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
  }));
  const activityDays = new Set(allHistory.map(h => {
    const d = new Date(h.timestamp);
    d.setHours(0,0,0,0);
    return d.getTime();
  }));
  // count streak going backwards from today
  let streak = 0;
  const today = new Date(); today.setHours(0,0,0,0);
  for(let i = 0; i <= 365; i++){
    const check = new Date(today.getTime() - i * 86400000);
    const key = check.getFullYear() + '-' + check.getMonth() + '-' + check.getDate();
    if(daySet.has(key)){ streak++; }
    else if(i > 0){ break; } // allow today to be missing (haven't studied yet today)
  }
  return { streak, activityDays };
}

function renderStreakBar(allHistory){
  const { streak, activityDays } = computeStreakFromHistory(allHistory);
  // Build 10-week heatmap (70 days ending today)
  const today = new Date(); today.setHours(0,0,0,0);
  let cells = '';
  for(let i = 69; i >= 0; i--){
    const d = new Date(today.getTime() - i * 86400000);
    d.setHours(0,0,0,0);
    const isToday = i === 0;
    // count activity on that day
    const dayStart = d.getTime();
    const dayEnd = dayStart + 86399999;
    const count = allHistory.filter(h => h.timestamp >= dayStart && h.timestamp <= dayEnd).length;
    const cls = count === 0 ? '' : count === 1 ? 'active-1' : count === 2 ? 'active-2' : 'active-3';
    cells += '<div class="hm-cell ' + cls + (isToday?' today':'') + '" title="' + d.toLocaleDateString() + (count?' — '+count+' session'+(count>1?'s':''):'') + '"></div>';
  }
  return (
    '<div class="streak-section">' +
      '<div class="streak-bar">' +
        '<span class="streak-flame">🔥</span>' +
        '<span class="streak-count">' + streak + '</span>' +
        '<span class="streak-label">day streak</span>' +
      '</div>' +
      '<div style="margin-bottom:var(--sp-2); font-size:11.5px; color:var(--ink-faint); font-family:var(--font-mono);">Last 10 weeks of activity</div>' +
      '<div class="activity-heatmap">' + cells + '</div>' +
    '</div>'
  );
}

// ── Weak concept analysis ──
function computeWeakTopics(sess){
  // sess = a submitted quiz session {questions, gradedResults}
  if(!sess || !sess.questions || !sess.questions.length) return [];
  const topicMap = {};
  sess.questions.forEach((q, qi) => {
    const topic = q.topic || TYPE_LABELS[q.type] || q.type;
    if(!topicMap[topic]) topicMap[topic] = { correct: 0, total: 0 };
    topicMap[topic].total++;
    if(sess.gradedResults[qi] && sess.gradedResults[qi].correct) topicMap[topic].correct++;
  });
  return Object.entries(topicMap)
    .map(([topic, v]) => ({ topic, correct: v.correct, total: v.total, pct: v.total ? Math.round(v.correct/v.total*100) : 0 }))
    .sort((a,b) => a.pct - b.pct);
}

function renderWeakAreas(sess){
  const weak = computeWeakTopics(sess);
  if(weak.length < 2) return ''; // not useful with only one topic
  return (
    '<div style="margin: var(--sp-5) 0;">' +
      '<h3 style="margin-bottom:var(--sp-3); font-size:15px;">Breakdown by Concept</h3>' +
      weak.map(w => (
        '<div class="weak-row">' +
          '<span class="weak-topic">' + esc(w.topic) + '</span>' +
          '<div class="weak-bar-wrap"><div class="weak-bar-fill" style="width:' + w.pct + '%; background:' + (w.pct < 60 ? 'var(--oxblood)' : w.pct < 85 ? 'var(--amber)' : 'var(--green)') + ';"></div></div>' +
          '<span class="weak-pct">' + w.correct + '/' + w.total + '</span>' +
        '</div>'
      )).join('') +
    '</div>'
  );
}

// ── Adaptive / manual difficulty ──
function getRecentScores(set, n=3){
  const hist = (set.history || []).slice(-n);
  return hist.map(h => h.pct);
}
function getDifficultyMode(set){
  return (set.quizSettings && set.quizSettings.difficultyMode) || 'dynamic';
}
function difficultyDisplay(set){
  const mode = getDifficultyMode(set);
  if(mode === 'easy') return { label: 'Easy (manual)', cls: '', note: 'Difficulty manually set to easy.' };
  if(mode === 'medium') return { label: 'Medium (manual)', cls: 'medium', note: 'Difficulty manually set to medium.' };
  if(mode === 'hard') return { label: 'Hard (manual)', cls: 'hard', note: 'Difficulty manually set to hard.' };
  // dynamic mode: infer from recent scores
  const recent = getRecentScores(set);
  if(recent.length < 2) return null;
  const avg = Math.round(recent.reduce((a,b)=>a+b,0)/recent.length);
  if(avg >= 88) return { label: 'Dynamic: Harder', cls: 'hard', note: 'Dynamic mode — scoring ' + avg + '% avg, questions will be more challenging.' };
  if(avg <= 55) return { label: 'Dynamic: Easier', cls: '', note: 'Dynamic mode — scoring ' + avg + '% avg, questions will be more accessible.' };
  return null;
}

function requestModelFallback(failedModel, errorMsg) {
  return new Promise((resolve) => {
    let fallbackModel = FALLBACK_MODELS.map(m => m.id).find(m => m !== failedModel) || SAFE_FALLBACK_MODEL;

      resolve
    };
    S.loading = false;
    render();
  });
}

async function callGemini(parts, { jsonSchema=true, _retried=false } = {}){
  if(!S.apiKey){ throw new Error('No API key set. Add your Google AI Studio API key in Settings.'); }
  const model = S.model || SAFE_FALLBACK_MODEL;
  const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + model + ':generateContent?key=' + encodeURIComponent(S.apiKey);
  const body = {
    contents: [{ role: 'user', parts }],
    generationConfig: jsonSchema ? { responseMimeType: 'application/json', temperature: 0.4 } : { temperature: 0.4 }
  };
  let res;
  try{
    res = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  }catch(networkErr){
    throw new Error('Could not reach the Gemini API. Ensure you are connected to the internet and API Key is valid.');
  }
  if(!res.ok){
    let msg = '';
    try{ const j = await res.json(); msg = j.error?.message || JSON.stringify(j); }catch(e){ msg = await res.text(); }
    const retired = res.status===404 && /no longer available|not found for API version|is not found/i.test(msg);
    if(retired && !_retried && model !== SAFE_FALLBACK_MODEL){
      S.model = SAFE_FALLBACK_MODEL;
      await saveModel();
      S.autoSwitchedModel = { from: model, to: SAFE_FALLBACK_MODEL };
      return callGemini(parts, { jsonSchema, _retried: true });
    }

    const highDemand = res.status === 429 || /resource_exhausted|quota|overloaded|high demand|too many requests/i.test(msg);
    if(highDemand && !_retried){
      const shouldSwitch = await requestModelFallback(model, msg);
      if(shouldSwitch){
        return callGemini(parts, { jsonSchema, _retried: true });
      }
    }

    throw new Error('Gemini API error (' + res.status + '): ' + msg.slice(0,300));
  }
  const data = await res.json();
  if(data.promptFeedback?.blockReason){ throw new Error('Request was blocked: ' + data.promptFeedback.blockReason); }
  const cand = data.candidates && data.candidates[0];
  const text = cand?.content?.parts?.map(p=>p.text||'').join('') || '';
  if(!text) throw new Error('Empty response from the model. Try again.');
  if(!jsonSchema) return text;
  try{ return JSON.parse(text); }
  catch(e){
    const cleaned = text.replace(/```json/gi,'').replace(/```/g,'').trim();
    return JSON.parse(cleaned);
  }
}

async function fileToInlinePart(file){
  if(S.supabaseClient){
    try {
      const fileName = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9_.-]/g, '_')}`;
      await S.supabaseClient.storage.from('study-files').upload(fileName, file);
    } catch(err){
      console.error('Supabase storage upload error', err);
    }
  }

  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const base64 = reader.result.split(',')[1];
      resolve({ inline_data: { mime_type: file.type || 'application/octet-stream', data: base64 } });
    };
    reader.onerror = ()=> reject(new Error('Could not read file: ' + file.name));
    reader.readAsDataURL(file);
  });
}

const TYPE_LABELS = {
  multiple_choice: 'Multiple choice',
  true_false: 'True or false',
  short_answer: 'Short answer',
  fill_blank: 'Fill in the blank',
};

const LATEX_INSTRUCTION = 'For any mathematical, chemical, or physics formulas/equations, write them using LaTeX syntax: wrap inline expressions in single dollar signs like $x^2 + 1$ and standalone/display equations in double dollar signs like $$E = mc^2$$. Use proper LaTeX commands (\\frac, \\sqrt, \\rightarrow, subscripts/superscripts, etc). Do not use LaTeX for plain prose.';

function levelInstruction(level){
  if(level === 'college'){
    return 'The student is at COLLEGE level. Use precise academic vocabulary, expect nuanced/analytical thinking, and do not oversimplify — write as you would for an undergraduate course.';
  }
  return 'The student is at HIGH SCHOOL level. Use clear, accessible vocabulary and more straightforward sentence structure — avoid unnecessarily advanced academic jargon, but do not dumb down the actual concepts.';
}

function getTargetLang(){
  const lang = S.profile?.language;
  if(!lang || lang === 'english') return 'English';
  if(lang === 'albanian') return 'Albanian (Gjuha Shqipe)';
  // support any future language value directly
  return lang.charAt(0).toUpperCase() + lang.slice(1);
}

async function generateStudyMaterials({ title, notesText, files, level, count, types, recentScores }){
  const typeList = types.map(t=>TYPE_LABELS[t]).join(', ');
  const targetLang = getTargetLang();
  let difficultyNote = '';
  if(recentScores && recentScores.length >= 2){
    const avg = Math.round(recentScores.reduce((a,b)=>a+b,0)/recentScores.length);
    if(avg >= 88) difficultyNote = 'The student has recently scored ' + avg + '% on average — increase question difficulty and include more nuanced, higher-order thinking questions.';
    else if(avg <= 55) difficultyNote = 'The student has recently scored ' + avg + '% on average — use slightly more straightforward, accessible questions to build confidence.';
  }
  const prompt = [
    'You are building study materials for a ' + (level==='college'?'college':'high school') + ' student.',
    levelInstruction(level),
    LATEX_INSTRUCTION,
    'Topic / set title: ' + title,
    difficultyNote ? 'Adaptive difficulty instruction: ' + difficultyNote : '',
    '',
    'Source material follows below as pasted notes and/or attached files (images or PDFs of notes).',
    'Read everything carefully before writing anything.',
    '',
    'IMPORTANT: All generated text content (notesSummary, stickyNotes, quiz questions, options, answers, explanations) MUST be entirely in ' + targetLang + '.',
    '',
    'First assess whether there is enough source material to generate ' + count + ' meaningful questions. Set "sufficientMaterial" to false if notes are too sparse (under ~100 words and no files), otherwise true.',
    '',
    'Also classify the academic subject this material belongs to, based on its content (e.g. if it looks like chemistry notes, classify it as Chemistry). Use a short, human-friendly subject name.',
    '',
    'Produce a JSON object with exactly these fields:',
    '{',
    '  "sufficientMaterial": boolean,',
    '  "category": string,  // short academic subject classification, e.g. "Chemistry", "World History", "Calculus", "Spanish", "Biology", "Computer Science" — pick the single best-fitting subject, use "General" only if genuinely unclear',
    '  "notesSummary": string,  // clear, consolidated plain-text write-up, thorough enough to write a test from, no markup, 300-900 words',
    '  "stickyNotes": [ { "title": string, "body": string } ],  // 6-12 revision notes, each title is a concept name, body is 1-3 sentences for an index card',
    '  "quiz": [',
    '    {',
    '      "type": one of ["multiple_choice","true_false","short_answer","fill_blank"],',
    '      "topic": string,  // 2-4 word concept label this question tests, e.g. "Due Process", "Cell Mitosis"',
    '      "question": string,',
    '      "options": [string],  // only for multiple_choice: exactly 4 options',
    '      "answer": string,',
    '      "explanation": string  // 1-2 sentences explaining WHY the answer is correct, shown after grading',
    '    }',
    '  ]',
    '}',
    '',
    'Generate exactly ' + count + ' quiz questions, using only these types: ' + typeList + '.',
    'Distribute types roughly evenly. Base every question strictly on the source material — nothing invented.',
    'For fill_blank, use "_____" in the question text; give the exact missing word/phrase as the answer.',
    'Calibrate difficulty for a ' + (level==='college'?'college':'high school') + ' student.',
    'Respond with JSON only.',
  ].filter(Boolean).join('\n');

  const parts = [{ text: prompt }];
  if(files && files.length){
    for(const f of files) parts.push({ inline_data: f.inline_data });
  }
  if(notesText && notesText.trim()){
    parts.push({ text: 'Pasted notes:\n' + notesText });
  }
  const result = await callGemini(parts);

  // Warn user if material was flagged as insufficient
  if(result.sufficientMaterial === false){
    S._insufficientMaterialWarning = true;
  } else {
    S._insufficientMaterialWarning = false;
  }
  return result;
}

async function gradeShortAnswers(items, level){
  const targetLang = getTargetLang();
  const prompt = [
    'You are an expert, fair teacher grading student quiz answers in ' + targetLang + '.',
    levelInstruction(level || 'high school'),
    'Grade each student answer below against the expected answer with full flexibility and free will. Account for language differences, true/false translations (e.g., matching English "True" or "False" to Albanian "E vërtetë" or "E rreme"/"E gabuar"), synonyms, spelling, case, and word order; the student does not need to match the expected answer word for word, only demonstrate correct substance and conceptual understanding.',
    'Return a JSON array, same length and order as the input, where each element is:',
    '{ "correct": boolean, "feedback": string }',
    'Keep feedback to one short, constructive sentence in ' + targetLang + '.',
    '',
    'Items:',
    JSON.stringify(items.map((it,i)=>({ index:i, question: it.question, expectedAnswer: it.expected, studentAnswer: it.userAnswer || '(no answer given)' }))),
  ].join('\n');
  return callGemini([{ text: prompt }]);
}

const DIFFICULTY_TIER_PROMPTS = {
  easy: 'EASY difficulty: use simple, direct, unambiguous wording. Each question should test exactly ONE concept in isolation — no combining multiple ideas, no multi-step reasoning. Favor straightforward recall, definitions, and basic identification. A student who understands the core concept should be able to answer quickly and confidently.',
  medium: 'MEDIUM difficulty: require a bit of applied reasoning — connecting two related facts, interpreting a short example, or explaining why/how something works — while still centering on a single core idea per question. More than pure recall, but not multi-layered.',
  hard: 'HARD difficulty: increase CONCEPTUAL depth, not sentence length. Require synthesis, analysis, comparison across ideas, or applying a concept to a new/unfamiliar scenario. Test deeper understanding, edge cases, and "why" over "what". Do NOT simply pad questions with extra descriptive text, longer scenarios, or dense wording to make them seem harder — a hard question can still be a single crisp sentence. The difficulty must come from the THINKING required, not from how much there is to read. Never turn this into a reading-comprehension exercise.'
};
const DIFFICULTY_SHARED_PROMPT = 'Regardless of difficulty tier: vary question length naturally — mix short, medium, and longer questions throughout the set rather than making every question uniform length. Keep all correct answers and curriculum/factual accuracy completely unaffected by difficulty — difficulty changes how a question is asked and what reasoning it requires, never whether the content or the correct answer is accurate.';

function resolveDifficultyTier(mode, recentScores){
  if(mode === 'easy' || mode === 'medium' || mode === 'hard') return mode;
  // dynamic: map straight onto the same tiers based on recent performance
  if(recentScores && recentScores.length >= 2){
    const avg = Math.round(recentScores.reduce((a,b)=>a+b,0)/recentScores.length);
    if(avg >= 88) return 'hard';
    if(avg <= 55) return 'easy';
  }
  return 'medium';
}

async function generateQuizOnly({ title, notesSummary, level, count, types, recentScores, difficultyMode, avoidQuestions }){
  const typeList = types.map(t=>TYPE_LABELS[t]).join(', ');
  const targetLang = getTargetLang();
  const mode = difficultyMode || 'dynamic';
  const tier = resolveDifficultyTier(mode, recentScores);
  let difficultyNote = DIFFICULTY_TIER_PROMPTS[tier] + ' ' + DIFFICULTY_SHARED_PROMPT;
  if(mode === 'dynamic' && recentScores && recentScores.length >= 2){
    const avg = Math.round(recentScores.reduce((a,b)=>a+b,0)/recentScores.length);
    difficultyNote += ' (This tier was auto-selected because the student\'s recent average is ' + avg + '%.)';
  }
  const prompt = [
    'Write a fresh practice quiz for a ' + (level==='college'?'college':'high school') + ' student on "' + title + '", based only on this notes summary:',
    levelInstruction(level),
    LATEX_INSTRUCTION,
    '',
    notesSummary,
    '',
    'Difficulty instruction: ' + difficultyNote,
    'IMPORTANT: All text MUST be entirely in ' + targetLang + '.',
    '',
    'Produce a JSON object: { "quiz": [ { "type": one of ["multiple_choice","true_false","short_answer","fill_blank"], "topic": string, "question": string, "options": [string] (4, only for multiple_choice), "answer": string, "explanation": string } ] }',
    'Generate exactly ' + count + ' NEW questions (do not repeat obvious prior phrasing), using only these types: ' + typeList + '. Distribute evenly.',
    avoidQuestions && avoidQuestions.length ? 'Do NOT reuse or lightly reword any of these existing questions: ' + JSON.stringify(avoidQuestions) : '',
    'For fill_blank use "_____" in the question text.',
    'Respond with JSON only.',
  ].filter(Boolean).join('\n');
  const res = await callGemini([{ text: prompt }]);
  return res.quiz;
}

// ── Timer helpers (shared by quiz + formal test) ──
function recommendTimerMinutes(count){
  return Math.max(5, Math.round((count + 5) / 5) * 5);
}
function formatTimer(totalSeconds){
  const s = Math.max(0, totalSeconds);
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return m + ':' + String(sec).padStart(2,'0');
}
let activeTimerInterval = null;
function clearActiveTimer(){
  if(activeTimerInterval){ clearInterval(activeTimerInterval); activeTimerInterval = null; }
}
function startSessionTimer(session, onExpire){
  clearActiveTimer();
  if(!session || !session.timerTotalSeconds) return;
  if(session.timerRemaining == null) session.timerRemaining = session.timerTotalSeconds;
  activeTimerInterval = setInterval(() => {
    session.timerRemaining--;
    const el = document.getElementById('timer-display');
    if(el){
      el.textContent = formatTimer(session.timerRemaining);
      el.classList.toggle('timer-warn', session.timerRemaining <= 60);
    }
    if(session.timerRemaining <= 0){
      clearActiveTimer();
      onExpire();
    }
  }, 1000);
}

function renderTimerSetting(idPrefix, recommendedMinutes, currentMode, currentCustom){
  const mode = currentMode || 'none';
  return (
    '<div class="field">' +
      '<label class="field-label">Timer</label>' +
      '<select id="' + idPrefix + '-timer-mode">' +
        '<option value="none" ' + (mode==='none'?'selected':'') + '>No timer</option>' +
        '<option value="recommended" ' + (mode==='recommended'?'selected':'') + '>Recommended (' + recommendedMinutes + ' min)</option>' +
        '<option value="custom" ' + (mode==='custom'?'selected':'') + '>Custom</option>' +
      '</select>' +
      '<input type="number" id="' + idPrefix + '-timer-custom" min="1" max="240" value="' + (currentCustom || recommendedMinutes) + '" placeholder="Minutes" style="margin-top:8px; display:' + (mode==='custom'?'block':'none') + '; width:120px;" />' +
    '</div>'
  );
}
function resolveTimerMinutes(idPrefix, recommendedMinutes){
  const mode = document.getElementById(idPrefix + '-timer-mode').value;
  if(mode === 'none') return null;
  if(mode === 'recommended') return recommendedMinutes;
  const custom = parseInt(document.getElementById(idPrefix + '-timer-custom').value);
  return (custom && custom > 0) ? custom : recommendedMinutes;
}

function positionTourOverlay(){
  const highlight = document.getElementById('tour-highlight');
  const tooltip = document.getElementById('tour-tooltip');
  if(!highlight || !tooltip || !S.tourActive) return;
  const step = TOUR_STEPS[S.tourStep];
  if(!step){ endTourAndPersist(); return; }
  const target = document.querySelector(step.selector);
  if(!target){
    // target isn't on screen (e.g. different route) - just skip to next step
    S.tourStep++;
    if(S.tourStep >= TOUR_STEPS.length){ endTourAndPersist(); }
    else render();
    return;
  }
  const rect = target.getBoundingClientRect();
  const pad = 6;
  highlight.style.top = (rect.top - pad) + 'px';
  highlight.style.left = (rect.left - pad) + 'px';
  highlight.style.width = (rect.width + pad*2) + 'px';
  highlight.style.height = (rect.height + pad*2) + 'px';

  const tooltipWidth = 300;
  let tLeft = rect.left;
  if(tLeft + tooltipWidth > window.innerWidth - 16) tLeft = window.innerWidth - tooltipWidth - 16;
  if(tLeft < 16) tLeft = 16;
  const spaceBelow = window.innerHeight - rect.bottom;
  const placeBelow = spaceBelow > 180;
  tooltip.style.left = tLeft + 'px';
  tooltip.style.width = tooltipWidth + 'px';
  if(placeBelow){
    tooltip.style.top = (rect.bottom + 14) + 'px';
    tooltip.style.bottom = 'auto';
  } else {
    tooltip.style.top = 'auto';
    tooltip.style.bottom = (window.innerHeight - rect.top + 14) + 'px';
  }
}

function openTutorDrawer(source, idx){
  const sess = source === 'quiz' ? S.quizSession : source === 'customtest' ? S.customTestSession : S.testSession;
  if(!sess) return;
  const q = sess.questions[idx];
  const context = {
    source,
    question: q.question,
    rubricOrAnswer: (source === 'test' || source === 'customtest') ? q.rubric : q.answer,
    userAnswer: sess.answers[idx]
  };
  S.tutorDrawer = { context, messages: [], loading: false };

async function sendTutorMessage(displayText){
  const d = S.tutorDrawer;
  if(!d || !displayText.trim()) return;
  d.messages.push({ role: 'user', text: displayText.trim() });
  d.loading = true;
  render();
  try{
    const apiMessages = d.messages.map((m,i) => i===0 ? { role:'user', text: buildTutorContextPrefix(d.context) + m.text } : m);
    const reply = await callGeminiChat(apiMessages);
    d.messages.push({ role: 'assistant', text: reply });
  }catch(e){
    d.messages.push({ role: 'assistant', text: 'Sorry, something went wrong: ' + e.message });
  }finally{
    d.loading = false;
    render();
    const msgBox = document.getElementById('tutor-messages');
    if(msgBox) msgBox.scrollTop = msgBox.scrollHeight;
  }
}

function renderCustomScaleEditor(custom) {
  const rows = (custom || []).map((row, i) => `

  return `

      <div style="font-weight:600; margin-bottom:4px;">Custom Grade Scale Thresholds (Minimum % for each letter)</div>

function renderDashboard(){
  const allSets = S.studySets;
  const allHistory = allSets.flatMap(s => (s.history||[]).map(h => ({ timestamp: h.timestamp })));
  const dueCards = computeDueCards(allSets);

  const allTags = Array.from(new Set(allSets.flatMap(s => s.tags || []))).sort();
  const search = (S.dashboardSearch || '').trim().toLowerCase();
  const activeTags = S.dashboardActiveTags || [];

  const filteredSets = allSets.filter(s => {
    if(activeTags.length && !activeTags.some(t => (s.tags||[]).includes(t))) return false;
    if(!search) return true;
    const hay = (s.title + ' ' + (s.category||'') + ' ' + (s.tags||[]).join(' ')).toLowerCase();
    return hay.includes(search);
  });

  let listHtml;
  if(allSets.length === 0){
    listHtml = '<div class="ledger">' +
      '<div class="ledger-empty">No study sets yet. Click <strong>New study set</strong> above to create one from your notes or files.</div>' +
    '</div>';
  } else if(filteredSets.length === 0){
    listHtml = '<div class="ledger"><div class="ledger-empty">No study sets match your search or tag filters.</div></div>';
  } else if(S.dashboardGroupBy === 'category'){
    const groups = {};
    filteredSets.forEach(s => { const cat = s.category || 'General'; (groups[cat] = groups[cat] || []).push(s); });
    listHtml = Object.keys(groups).sort().map(cat => (
      '<div class="set-group">' +
        '<div class="set-group-heading">' + esc(cat) + ' (' + groups[cat].length + ')</div>' +
        '<div class="ledger">' + groups[cat].map(renderSetRow).join('') + '</div>' +
      '</div>'
    )).join('');
  } else {
    listHtml = '<div class="ledger">' + filteredSets.map(renderSetRow).join('') + '</div>';
  }

  return (
    (S.recentCloneInfo ? (
      '<div class="callout success clone-banner">' +
        '<span>Added &ldquo;' + esc(S.recentCloneInfo.title) + '&rdquo; to your study sets &mdash; copied from ' + esc(S.recentCloneInfo.author) + '.</span>' +
        '<button type="button" class="linklike" id="dismiss-clone-banner" style="background:none;border:none;color:inherit;text-decoration:underline;font-size:12px;padding:0;">Dismiss</button>' +
      '</div>'
    ) : '') +
    (allHistory.length ? renderStreakBar(allHistory) : '') +
    (allSets.length ? (
      '<div class="dash-actions">' +
        '<button class="btn btn-primary" data-nav="dailyreview">Daily Review' + (dueCards.length ? ' <span class="due-badge">' + dueCards.length + '</span>' : '') + '</button>' +

function computeStatsData(){
  const allIds = S.statsSelectedSetIds || S.studySets.map(s=>s.id);
  const selectedSets = S.studySets.filter(s => allIds.includes(s.id));
  const entries = [];
  selectedSets.forEach(set => {
    (set.history || []).forEach(h => {
      entries.push({
        setId: set.id,
        setTitle: set.title,
        category: set.category || 'General',
        type: h.type,
        pct: h.pct,
        letter: h.letter,
        scoreText: h.scoreText,
        timestamp: h.timestamp
      });
    });
  });
  entries.sort((a,b) => a.timestamp - b.timestamp);
  return { selectedSets, entries };
}

function renderStatsPage(){
  if(!S.statsSelectedSetIds) S.statsSelectedSetIds = S.studySets.map(s=>s.id);
  const { selectedSets, entries } = computeStatsData();

  const selectorHtml = (
    '<div class="stats-select-panel">' +
      '<div class="stats-select-head">' +
        '<h4>Choose which study sets to include</h4>' +
        '<div class="stats-select-actions">' +
          '<button type="button" id="stats-select-all">Select all</button>' +
          '<button type="button" id="stats-select-none">Clear</button>' +
        '</div>' +
      '</div>' +
      (S.studySets.length === 0 ?
        '<div class="muted" style="font-size:13px;">No study sets yet.</div>' :
        '<div class="stats-set-list">' +
          S.studySets.map(s => {
            const isSel = S.statsSelectedSetIds.includes(s.id);
            return (
              '<div class="stats-set-chip ' + (isSel?'selected':'') + '" data-stats-toggle="' + s.id + '">' +
                '<input type="checkbox" ' + (isSel?'checked':'') + ' style="pointer-events:none;" />' +
                '<span>' + esc(s.title) + '</span>' +
                '<span class="chip-cat">' + esc(s.category || 'General') + '</span>' +
              '</div>'
            );
          }).join('') +
        '</div>'
      ) +
    '</div>'
  );

  if(entries.length === 0){
    return (
      '<div class="section-heading"><h2>Stats</h2></div>' +
      selectorHtml +
      '<div class="stats-empty">No quiz or test attempts yet for the selected study sets. Take a practice quiz or formal test to start building stats.</div>'
    );
  }

  const totalAttempts = entries.length;
  const overallAvg = Math.round(entries.reduce((a,e)=>a+e.pct,0) / totalAttempts);
  const quizEntries = entries.filter(e=>e.type==='quiz');
  const testEntries = entries.filter(e=>e.type==='test' || e.type==='comprehensive' || e.type==='customtest');
  const quizAvg = quizEntries.length ? Math.round(quizEntries.reduce((a,e)=>a+e.pct,0)/quizEntries.length) : null;
  const testAvg = testEntries.length ? Math.round(testEntries.reduce((a,e)=>a+e.pct,0)/testEntries.length) : null;

  // Category averages
  const catMap = {};
  entries.forEach(e => {
    if(!catMap[e.category]) catMap[e.category] = { sum:0, count:0 };
    catMap[e.category].sum += e.pct;
    catMap[e.category].count++;
  });
  const catStats = Object.entries(catMap).map(([cat,v]) => ({ cat, avg: Math.round(v.sum/v.count), count: v.count })).sort((a,b)=>b.avg-a.avg);
  const bestCat = catStats[0];
  const worstCat = catStats[catStats.length-1];

  return (
    '<div class="section-heading"><h2>Stats</h2></div>' +
    selectorHtml +
    renderStreakBar(entries.map(e => ({ timestamp: e.timestamp }))) +
    '<div class="stats-cards">' +
      '<div class="stats-card"><span class="num">' + totalAttempts + '</span><span class="lbl">TOTAL ATTEMPTS</span></div>' +
      '<div class="stats-card"><span class="num">' + overallAvg + '%</span><span class="lbl">OVERALL AVERAGE</span></div>' +
      '<div class="stats-card"><span class="num">' + quizEntries.length + '</span><span class="lbl">QUIZZES TAKEN</span></div>' +
      '<div class="stats-card"><span class="num">' + testEntries.length + '</span><span class="lbl">TESTS TAKEN</span></div>' +
      (bestCat ? '<div class="stats-card"><span class="num" style="font-size:16px; color:var(--green);">' + esc(bestCat.cat) + '</span><span class="lbl">STRONGEST SUBJECT (' + bestCat.avg + '%)</span></div>' : '') +
      (worstCat && worstCat !== bestCat ? '<div class="stats-card"><span class="num" style="font-size:16px; color:var(--oxblood);">' + esc(worstCat.cat) + '</span><span class="lbl">WEAKEST SUBJECT (' + worstCat.avg + '%)</span></div>' : '') +
    '</div>' +

    '<div class="stats-chart-block">' +
      '<h4>Score Trend Over Time</h4>' +
      '<div class="stats-chart-wrap"><canvas id="stats-trend-chart"></canvas></div>' +
    '</div>' +

    '<div class="stats-chart-block">' +
      '<h4>Average Score by Subject</h4>' +
      '<div class="stats-chart-wrap"><canvas id="stats-subject-chart"></canvas></div>' +
    '</div>' +

    '<div class="stats-chart-block">' +
      '<h4>Average Score by Study Set</h4>' +
      '<div class="stats-chart-wrap"><canvas id="stats-set-chart"></canvas></div>' +
    '</div>' +

    (quizEntries.length && testEntries.length ? (
      '<div class="stats-chart-block">' +
        '<h4>Quizzes vs. Formal Tests</h4>' +
        '<div class="stats-chart-wrap" style="height:200px;"><canvas id="stats-type-chart"></canvas></div>' +
      '</div>'
    ) : '') +

    '<div class="stats-chart-block">' +
      '<h4>All Attempts</h4>' +
      '<div class="ledger">' +
        entries.slice().reverse().slice(0, 100).map(e => (
          '<div class="ledger-row">' +
            '<div>' +
              '<div><span class="hist-type">' + e.type.toUpperCase() + '</span> ' + esc(e.setTitle) + ' <span class="chip-cat" style="border:none; padding-left:0;">' + esc(e.category) + '</span></div>' +
              '<div class="ledger-meta"><span>' + new Date(e.timestamp).toLocaleString() + '</span><span>Grade: <strong>' + esc(e.letter) + '</strong></span></div>' +
            '</div>' +
            '<div class="hist-score"><span class="num">' + e.scoreText + '</span> (' + e.pct + '%)</div>' +
          '</div>'
        )).join('') +
      '</div>' +
    '</div>'
  );
}
